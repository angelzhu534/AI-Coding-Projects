<!DOCTYPE html>
<html lang="en" style="background:#0F141A;">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark only">
<title>Market-Entry Engagement System</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:wght@0,500;0,600;0,700&family=Inter:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');
:root{
  color-scheme:dark only;
  --bg:#0F141A; --bg2:#0A0E13; --panel:#171F28; --panel2:#1E2832; --panel3:#26323D;
  --ink:#EAF1F6; --ink-soft:#9DB0BE; --ink-dim:#6B7C89; --line:#2A3640;
  --gold:#D9A84E; --gold-dim:#8A6E32; --teal:#5FB6A8; --coral:#E07856; --green:#5FBE7E; --red:#E05858;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{background:#0F141A!important;scroll-behavior:smooth;}
body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased;}

/* header */
.top{position:sticky;top:0;z-index:30;background:rgba(10,14,19,0.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);}
.top-inner{max-width:1080px;margin:0 auto;padding:14px 22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
.brand{font-family:'Fraunces',serif;font-weight:600;font-size:18px;letter-spacing:-0.01em;}
.brand span{color:var(--gold);}
.client-bar{display:flex;align-items:center;gap:8px;margin-left:auto;flex-wrap:wrap;}
.client-bar input{background:var(--panel);border:1px solid var(--line);border-radius:6px;color:var(--ink);font-family:'Inter';font-size:13px;padding:7px 11px;width:200px;}
.client-bar input:focus{outline:none;border-color:var(--gold);}
.client-bar label{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--ink-dim);}
.overall{display:flex;align-items:center;gap:10px;}
.overall .ring{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--gold);}

/* tabs */
.phase-tabs{max-width:1080px;margin:0 auto;padding:14px 22px 0;display:flex;gap:6px;flex-wrap:wrap;}
.ptab{flex:1;min-width:120px;background:var(--panel);border:1px solid var(--line);border-radius:8px 8px 0 0;padding:12px 14px;cursor:pointer;transition:all .18s;border-bottom:none;position:relative;}
.ptab:hover{background:var(--panel2);}
.ptab.active{background:var(--panel2);border-color:var(--gold);}
.ptab .pn{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.12em;color:var(--gold);text-transform:uppercase;}
.ptab .pt{font-family:'Fraunces',serif;font-weight:600;font-size:14px;margin-top:2px;line-height:1.1;}
.ptab .pbar{height:3px;background:var(--line);border-radius:2px;margin-top:9px;overflow:hidden;}
.ptab .pbar i{display:block;height:100%;background:var(--gold);width:0;transition:width .4s;}
.ptab.done .pbar i{background:var(--green);}
.ptab .pcheck{position:absolute;top:8px;right:10px;font-size:13px;color:var(--green);opacity:0;transition:opacity .2s;}
.ptab.done .pcheck{opacity:1;}

/* wrap */
.wrap{max-width:1080px;margin:0 auto;padding:26px 22px 100px;}
.view{display:none;}.view.active{display:block;animation:fade .35s ease;}
@keyframes fade{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

.phead{margin-bottom:22px;}
.phead .eye{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.22em;text-transform:uppercase;color:var(--gold);margin-bottom:8px;}
.phead h2{font-family:'Fraunces',serif;font-weight:600;font-size:clamp(26px,4.5vw,36px);line-height:1.05;}
.phead .obj{color:var(--ink-soft);font-size:15.5px;margin-top:8px;max-width:70ch;font-style:italic;}

.section-label{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:var(--teal);margin:26px 0 12px;display:flex;align-items:center;gap:10px;}
.section-label::after{content:"";flex:1;height:1px;background:var(--line);}

/* deliverables */
.deliv{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;}
.deliv-row{display:grid;grid-template-columns:1.6fr 1fr 1fr 1.4fr;gap:0;border-bottom:1px solid var(--line);}
.deliv-row:last-child{border-bottom:none;}
.deliv-row.head{background:var(--panel2);}
.deliv-row.head>div{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--ink-dim);}
.deliv-row>div{padding:12px 16px;font-size:14px;border-right:1px solid var(--line);}
.deliv-row>div:last-child{border-right:none;color:var(--ink-soft);}
.deliv-row .dname{font-weight:600;color:var(--ink);}
@media(max-width:680px){.deliv-row{grid-template-columns:1fr 1fr;}.deliv-row>div:nth-child(3),.deliv-row>div:nth-child(4){display:none;}}

/* checklist */
.tasks{display:flex;flex-direction:column;gap:8px;}
.task{display:flex;align-items:flex-start;gap:13px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;cursor:pointer;transition:all .15s;}
.task:hover{border-color:var(--gold-dim);background:var(--panel2);}
.task .box{width:22px;height:22px;border:2px solid var(--ink-dim);border-radius:6px;flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;transition:all .15s;font-size:14px;color:var(--bg);}
.task.done .box{background:var(--green);border-color:var(--green);}
.task.done .box::after{content:"✓";font-weight:700;}
.task .tx{font-size:14.5px;transition:all .15s;}
.task.done .tx{color:var(--ink-dim);text-decoration:line-through;}

/* gate */
.gate{margin-top:22px;border:1.5px solid var(--gold-dim);border-radius:12px;overflow:hidden;background:linear-gradient(180deg,rgba(217,168,78,0.06),var(--panel));}
.gate.open{border-color:var(--green);}
.gate-head{padding:14px 18px;background:rgba(217,168,78,0.12);display:flex;align-items:center;gap:12px;}
.gate.open .gate-head{background:rgba(95,190,126,0.14);}
.gate-head .ico{font-size:18px;}
.gate-head .gt{font-family:'Fraunces',serif;font-weight:600;font-size:17px;}
.gate-head .status{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.1em;text-transform:uppercase;padding:4px 10px;border-radius:20px;background:var(--panel3);color:var(--gold);}
.gate.open .gate-head .status{background:rgba(95,190,126,0.2);color:var(--green);}
.gate-body{padding:16px 18px;}
.gate-crit{display:flex;align-items:flex-start;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer;}
.gate-crit:last-child{border-bottom:none;}
.gate-crit .gbox{width:20px;height:20px;border:2px solid var(--teal);border-radius:5px;flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--bg);transition:all .15s;}
.gate-crit.checked .gbox{background:var(--teal);}
.gate-crit.checked .gbox::after{content:"✓";font-weight:700;}
.gate-crit .gtx{font-size:14px;}
.gate-crit.checked .gtx{color:var(--ink-soft);}
.gate-fee{margin-top:14px;padding:12px 16px;background:var(--panel2);border-radius:8px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.gate-fee label{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--ink-dim);}
.gate-fee .feeval{font-family:'Fraunces',serif;font-weight:600;font-size:18px;color:var(--teal);}

/* pricing view */
.price-table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;}
.price-table th{text-align:left;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--ink-dim);padding:13px 16px;border-bottom:1px solid var(--line);background:var(--panel2);}
.price-table td{padding:13px 16px;border-bottom:1px solid var(--line);font-size:14.5px;vertical-align:middle;}
.price-table tr:last-child td{border-bottom:none;}
.price-table .pname{font-weight:600;}
.price-table input{background:var(--panel2);border:1px solid var(--line);border-radius:6px;color:var(--gold);font-family:'IBM Plex Mono',monospace;font-size:13px;padding:6px 9px;width:90px;text-align:right;}
.price-table input:focus{outline:none;border-color:var(--gold);}
.price-table .role{color:var(--ink-soft);font-size:13px;}
.price-table tr.total td{background:var(--panel2);font-weight:700;}
.price-table .hl{color:var(--gold);font-family:'IBM Plex Mono',monospace;}
.upside{margin-top:18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;}
.upcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;}
.upcard .ul{font-family:'Fraunces',serif;font-weight:600;font-size:16px;margin-bottom:3px;}
.upcard .uv{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--teal);margin-bottom:6px;}
.upcard .un{font-size:13px;color:var(--ink-soft);}

/* tracker */
.track-table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;}
.track-table th{text-align:left;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--ink-dim);padding:13px 16px;border-bottom:1px solid var(--line);background:var(--panel2);}
.track-table td{padding:11px 16px;border-bottom:1px solid var(--line);font-size:14px;}
.track-table tr:last-child td{border-bottom:none;}
.pill{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.06em;text-transform:uppercase;padding:4px 10px;border-radius:20px;display:inline-block;}
.pill.ns{background:var(--panel3);color:var(--ink-dim);}
.pill.ip{background:rgba(217,168,78,0.18);color:var(--gold);}
.pill.dn{background:rgba(95,190,126,0.18);color:var(--green);}
.track-bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;width:90px;}
.track-bar i{display:block;height:100%;background:var(--gold);width:0;transition:width .4s;}
.track-bar.full i{background:var(--green);}

.note{font-size:13px;color:var(--ink-dim);margin-top:18px;font-style:italic;}
.reset{background:none;border:1px solid var(--line);color:var(--ink-dim);font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.08em;text-transform:uppercase;padding:7px 13px;border-radius:6px;cursor:pointer;transition:all .15s;}
.reset:hover{border-color:var(--red);color:var(--red);}
.savedtag{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--green);opacity:0;transition:opacity .3s;}
.savedtag.show{opacity:1;}
</style>
</head>
<body>

<div class="top">
  <div class="top-inner">
    <div class="brand">Market-Entry <span>System</span></div>
    <div class="client-bar">
      <label>Client</label>
      <input id="clientName" type="text" placeholder="ClientName · Market · Year">
      <span class="savedtag" id="savedTag">saved</span>
      <div class="overall"><span class="ring" id="overallRing">0%</span></div>
      <button class="reset" id="resetBtn">Reset</button>
    </div>
  </div>
  <div class="phase-tabs" id="phaseTabs"></div>
</div>

<div class="wrap" id="wrap"></div>

<script>
const PHASES = [
  {
    id:"p1", n:"Phase 1", title:"Market Diagnostic",
    obj:"Determine whether and how the client should enter the target market — a go / no-go decision with evidence behind it.",
    deliverables:[
      ["Market Fit & Sizing Report","Deck + model","Lead","TAM / SAM / SOM, demand signals"],
      ["Regulatory Landscape Map","Doc","Lead + counsel","Entry barriers, licensing"],
      ["Competitive & Channel Scan","Doc","Analyst","Who's there, how they sell"],
      ["Go / No-Go Recommendation","Memo","Lead","The honest call + rationale"]
    ],
    tasks:[
      "Define target market, product scope, and client objectives in writing",
      "Size the opportunity — TAM / SAM / SOM with named demand signals, not guesses",
      "Map the regulatory landscape — licensing, ownership rules, import / data / tax constraints",
      "Identify and profile the top 5–8 incumbent competitors and their channels",
      "Assess product-market fit for the geography (localization needs, pricing reality)",
      "Identify the 3 biggest entry risks and whether they're surmountable",
      "Pressure-test demand with at least 3 local sources / interviews",
      "Write the honest go / no-go memo with rationale — be willing to say no"
    ],
    gate:[
      "Client objectives and target market are documented and agreed",
      "Market is sized with evidence, not assumption",
      "Regulatory path understood at a high level (deep dive in Phase 2)",
      "A clear, defensible go / no-go recommendation delivered and accepted"
    ],
    fee:"$15K – $40K  ·  fixed-fee diagnostic"
  },
  {
    id:"p2", n:"Phase 2", title:"Entry Architecture",
    obj:"Stand up the legal and operational foundation to legally operate in-market. This is the wedge — the urgent, mandatory, easy first yes.",
    deliverables:[
      ["Entity & Ownership Structure","Spec + filing","Lead + counsel","Optimal for law + tax"],
      ["Compliance & Licensing Pack","Checklist + filings","Counsel","Everything mandatory"],
      ["Tax & Banking Setup","Spec","Accountant","Registrations, accounts"],
      ["Operational Setup Plan","Doc","Lead","Agent, insurance, IP"]
    ],
    tasks:[
      "Select optimal entity type & ownership structure for the jurisdiction",
      "Engage and brief vetted local legal counsel from the partner network",
      "File entity formation and all mandatory registrations",
      "Complete tax registration and transfer-pricing approach",
      "Open in-market banking / payment infrastructure",
      "Secure required licenses and permits for the specific activity",
      "Put a compliance calendar in place (renewals, filings, reporting)",
      "Set up registered agent / local address / insurance as required"
    ],
    gate:[
      "Legal entity is formed and registered",
      "All mandatory licenses / permits secured or clearly in-flight",
      "Tax and banking infrastructure is live",
      "A compliance calendar exists so nothing lapses"
    ],
    fee:"$25K – $75K  ·  setup + pass-through of local fees"
  },
  {
    id:"p3", n:"Phase 3", title:"Go-To-Market Build",
    obj:"Build the plan and machinery to actually win customers in the new market. This is the high-value core — price it accordingly.",
    deliverables:[
      ["Channel & Distribution Strategy","Strategy doc","Lead","How product reaches buyers"],
      ["Local Partnership Map + Intros","Doc + intros","Lead + network","Distributors, key accounts"],
      ["Localized Pricing & Packaging","Model","Lead","Priced for the market"],
      ["Launch Plan & 90-Day Roadmap","Plan + Gantt","Lead","Sequenced go-live"]
    ],
    tasks:[
      "Define the go-to-market motion (direct, channel, marketplace, hybrid)",
      "Identify and prioritize distribution channels for the geography",
      "Map and make warm intros to local partners / distributors / key accounts",
      "Build localized pricing & packaging (FX, willingness-to-pay, competitor anchors)",
      "Localize positioning, messaging, and brand for cultural fit",
      "Define the marketing & demand-gen approach for the market",
      "Build the launch plan with a sequenced 90-day roadmap",
      "Set GTM KPIs and the dashboard to track them"
    ],
    gate:[
      "A clear GTM motion and channel strategy is documented and agreed",
      "At least 2–3 concrete local partnership leads are in motion",
      "Localized pricing is set with rationale",
      "A sequenced launch plan with owners and dates exists"
    ],
    fee:"$50K – $150K  ·  the value core"
  },
  {
    id:"p4", n:"Phase 4", title:"Operational Stand-Up",
    obj:"Build the running machine — people, supply chain, systems — so the market launch can actually execute.",
    deliverables:[
      ["Org & Hiring Plan","Plan + JDs","Lead + recruiter","Who's needed, in order"],
      ["Supply Chain / Delivery Setup","Spec","Lead","Local delivery mechanics"],
      ["Systems & Tooling Stack","Spec","Lead","CRM, ops, finance, comms"],
      ["SOPs & Playbooks","Doc set","Lead","How the team runs day-to-day"]
    ],
    tasks:[
      "Build the local org design and phased hiring plan",
      "Source first local hires via the recruiter partner network (or interim staff)",
      "Stand up the supply chain / service-delivery mechanics in-market",
      "Select and configure the operational systems stack (CRM, ops, finance)",
      "Write SOPs and playbooks for the core repeatable processes",
      "Set up local finance / reporting integrated with HQ",
      "Run a pilot / soft launch to stress-test the machine",
      "Resolve pilot issues and confirm operational readiness"
    ],
    gate:[
      "Core local team (or interim coverage) is in place",
      "Supply chain / delivery mechanics are functional and tested",
      "Systems stack is live and SOPs are documented",
      "A pilot has validated the operation can actually run"
    ],
    fee:"$40K – $120K"
  },
  {
    id:"p5", n:"Phase 5", title:"Handover / Ongoing",
    obj:"Transition to the client's team, or retain as fractional ops — and convert to recurring revenue plus equity upside where possible.",
    deliverables:[
      ["Knowledge Transfer Pack","Docs + training","Lead","Everything to run it"],
      ["Performance Dashboard","Live model","Lead","KPIs, targets, alerts"],
      ["Transition / Retainer Plan","Agreement","Lead","Handover or ongoing"],
      ["Equity / Success-Fee Terms","Term sheet","Lead","Upside, not just fees"]
    ],
    tasks:[
      "Train the client's team on all SOPs and systems",
      "Deliver the live performance dashboard with targets and alerts",
      "Define ongoing support scope (full handover vs. fractional ops retainer)",
      "Set up the recurring-revenue retainer if applicable",
      "Where appropriate, structure an equity stake or success fee for upside",
      "Document lessons learned and update the master playbook template",
      "Capture a case study and request referrals",
      "Schedule the post-launch review checkpoints (30 / 60 / 90)"
    ],
    gate:[
      "Client team trained and can operate independently OR retainer signed",
      "Dashboard and reporting cadence are live",
      "Recurring revenue and / or equity terms agreed where applicable",
      "Case study captured and master playbook updated"
    ],
    fee:"$10K – $30K handover  ·  $5K–$25K/mo retainer  ·  + equity"
  }
];

const PRICING = [
  ["1 · Diagnostic",15000,40000,"Low-risk entry; proves value; qualifies the client",false],
  ["2 · Entry Architecture",25000,75000,"THE WEDGE — urgent, mandatory, easy yes",true],
  ["3 · GTM Build",50000,150000,"THE CORE — highest value, stickiest",true],
  ["4 · Operational Stand-Up",40000,120000,"Builds the running machine",false],
  ["5 · Handover",10000,30000,"Clean exit or pivot to retainer",false]
];

// ---- state ----
const STORE_KEY = "mes_state_v1";
let state = load();
function load(){ try{ return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }catch(e){ return {}; } }
function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); flashSaved(); }catch(e){} }
function flashSaved(){ const t=document.getElementById('savedTag'); t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),1200); }
function key(p,type,i){ return `${p}_${type}_${i}`; }
function get(k){ return !!state[k]; }
function set(k,v){ state[k]=v; save(); }

// ---- build phase tabs ----
const tabsEl=document.getElementById('phaseTabs');
PHASES.forEach((ph,idx)=>{
  const t=document.createElement('div'); t.className='ptab'+(idx===0?' active':''); t.dataset.view=ph.id;
  t.innerHTML=`<span class="pcheck">●</span><div class="pn">${ph.n}</div><div class="pt">${ph.title}</div><div class="pbar"><i></i></div>`;
  t.addEventListener('click',()=>showView(ph.id));
  tabsEl.appendChild(t);
});
// extra tabs
[["pricing","◆","Pricing & Scope"],["tracker","▤","Engagement Tracker"]].forEach(([id,sym,label])=>{
  const t=document.createElement('div'); t.className='ptab'; t.dataset.view=id;
  t.innerHTML=`<div class="pn">${sym}</div><div class="pt">${label}</div>`;
  t.addEventListener('click',()=>showView(id));
  tabsEl.appendChild(t);
});

// ---- render views ----
const wrap=document.getElementById('wrap');
function renderPhase(ph){
  const div=document.createElement('div'); div.className='view'; div.id='view_'+ph.id;
  let h=`<div class="phead"><div class="eye">${ph.n}</div><h2>${ph.title}</h2><p class="obj">${ph.obj}</p></div>`;
  // deliverables
  h+=`<div class="section-label">Deliverables</div><div class="deliv"><div class="deliv-row head"><div>Deliverable</div><div>Format</div><div>Owner</div><div>Notes</div></div>`;
  ph.deliverables.forEach(d=>{ h+=`<div class="deliv-row"><div class="dname">${d[0]}</div><div>${d[1]}</div><div>${d[2]}</div><div>${d[3]}</div></div>`; });
  h+=`</div>`;
  // tasks
  h+=`<div class="section-label">Execution Checklist</div><div class="tasks" id="tasks_${ph.id}">`;
  ph.tasks.forEach((t,i)=>{ const k=key(ph.id,'task',i); h+=`<div class="task${get(k)?' done':''}" data-k="${k}"><div class="box"></div><div class="tx">${t}</div></div>`; });
  h+=`</div>`;
  // gate
  h+=`<div class="gate" id="gate_${ph.id}"><div class="gate-head"><span class="ico">◆</span><span class="gt">Phase Gate</span><span class="status">Locked</span></div><div class="gate-body">`;
  ph.gate.forEach((g,i)=>{ const k=key(ph.id,'gate',i); h+=`<div class="gate-crit${get(k)?' checked':''}" data-k="${k}"><div class="gbox"></div><div class="gtx">${g}</div></div>`; });
  h+=`<div class="gate-fee"><label>Indicative fee</label><span class="feeval">${ph.fee}</span></div></div></div>`;
  div.innerHTML=h;
  wrap.appendChild(div);
  // wire tasks
  div.querySelectorAll('.task').forEach(el=>{
    el.addEventListener('click',()=>{ const k=el.dataset.k; const nv=!get(k); set(k,nv); el.classList.toggle('done',nv); updatePhase(ph); });
  });
  div.querySelectorAll('.gate-crit').forEach(el=>{
    el.addEventListener('click',()=>{ const k=el.dataset.k; const nv=!get(k); set(k,nv); el.classList.toggle('checked',nv); updatePhase(ph); });
  });
}
function renderPricing(){
  const div=document.createElement('div'); div.className='view'; div.id='view_pricing';
  let h=`<div class="phead"><div class="eye">Pricing & Scope</div><h2>Fee by Phase</h2><p class="obj">Land on the wedge (Phase 2). Expand into the value (Phases 3–5). Edit any figure — totals update live.</p></div>`;
  h+=`<table class="price-table"><tr><th>Phase</th><th>Low</th><th>High</th><th>Strategic role</th></tr>`;
  PRICING.forEach((p,i)=>{
    const lk='price_lo_'+i, hk='price_hi_'+i;
    const lo=state[lk]!==undefined?state[lk]:p[1];
    const hi=state[hk]!==undefined?state[hk]:p[2];
    h+=`<tr><td class="pname">${p[0]}</td><td><input type="number" data-pk="${lk}" value="${lo}"></td><td><input type="number" data-pk="${hk}" value="${hi}"></td><td class="role">${p[4]?'<b style="color:var(--gold)">'+p[3]+'</b>':p[3]}</td></tr>`;
  });
  h+=`<tr class="total"><td>Full engagement</td><td class="hl" id="totLo">—</td><td class="hl" id="totHi">—</td><td class="role">Per full market entry, before retainer / equity</td></tr></table>`;
  h+=`<div class="section-label">Recurring & Upside</div><div class="upside">
    <div class="upcard"><div class="ul">Ongoing retainer</div><div class="uv">$5K – $25K / mo</div><div class="un">The recurring revenue that compounds month over month.</div></div>
    <div class="upcard"><div class="ul">Equity / success fee</div><div class="uv">2 – 5% or milestone</div><div class="un">Where the real wealth upside lives — take ownership, not just fees.</div></div>
    <div class="upcard"><div class="ul">Per-market multiplier</div><div class="uv">× each new market</div><div class="un">Same playbook, new geography. This is how it scales into an asset.</div></div>
  </div>`;
  div.innerHTML=h; wrap.appendChild(div);
  div.querySelectorAll('input[data-pk]').forEach(inp=>{
    inp.addEventListener('input',()=>{ state[inp.dataset.pk]=parseFloat(inp.value)||0; save(); recalcPrice(); });
  });
  recalcPrice();
}
function recalcPrice(){
  let lo=0,hi=0;
  PRICING.forEach((p,i)=>{ lo+=(state['price_lo_'+i]!==undefined?state['price_lo_'+i]:p[1]); hi+=(state['price_hi_'+i]!==undefined?state['price_hi_'+i]:p[2]); });
  const f=n=>'$'+Math.round(n).toLocaleString();
  const a=document.getElementById('totLo'), b=document.getElementById('totHi');
  if(a){a.textContent=f(lo);b.textContent=f(hi);}
}
function renderTracker(){
  const div=document.createElement('div'); div.className='view'; div.id='view_tracker';
  let h=`<div class="phead"><div class="eye">Engagement Tracker</div><h2>Live Status</h2><p class="obj">Auto-updates from your checklists. Each phase shows progress and whether its gate is cleared.</p></div>`;
  h+=`<table class="track-table"><tr><th>Phase</th><th>Tasks</th><th>Progress</th><th>Gate</th></tr><tbody id="trackBody"></tbody></table>`;
  h+=`<p class="note">Tip: a phase only counts as "Complete" when every task is done <em>and</em> all gate criteria are checked. That's the discipline that keeps the sequence intact.</p>`;
  div.innerHTML=h; wrap.appendChild(div);
  refreshTracker();
}
function phaseStats(ph){
  const tDone=ph.tasks.filter((_,i)=>get(key(ph.id,'task',i))).length;
  const gDone=ph.gate.filter((_,i)=>get(key(ph.id,'gate',i))).length;
  const pct=Math.round(tDone/ph.tasks.length*100);
  const gateOpen = tDone===ph.tasks.length;
  const complete = gateOpen && gDone===ph.gate.length;
  return {tDone,tTot:ph.tasks.length,gDone,gTot:ph.gate.length,pct,gateOpen,complete};
}
function refreshTracker(){
  const body=document.getElementById('trackBody'); if(!body) return; body.innerHTML='';
  PHASES.forEach(ph=>{
    const s=phaseStats(ph);
    const pill = s.complete?'<span class="pill dn">Complete</span>':(s.tDone>0?'<span class="pill ip">In Progress</span>':'<span class="pill ns">Not Started</span>');
    const gate = s.complete?'<span class="pill dn">Cleared</span>':(s.gateOpen?'<span class="pill ip">Ready</span>':'<span class="pill ns">Locked</span>');
    body.innerHTML+=`<tr><td><b>${ph.n} · ${ph.title}</b></td><td>${pill}</td><td><div class="track-bar${s.pct===100?' full':''}"><i style="width:${s.pct}%"></i></div></td><td>${gate}</td></tr>`;
  });
}

// build everything
PHASES.forEach(renderPhase);
renderPricing();
renderTracker();

// ---- per-phase UI updates ----
function updatePhase(ph){
  const s=phaseStats(ph);
  const tab=document.querySelector(`.ptab[data-view="${ph.id}"]`);
  tab.querySelector('.pbar i').style.width=s.pct+'%';
  tab.classList.toggle('done',s.complete);
  // gate lock state
  const gate=document.getElementById('gate_'+ph.id);
  gate.classList.toggle('open',s.gateOpen);
  const st=gate.querySelector('.status');
  if(s.complete){ st.textContent='Cleared'; }
  else if(s.gateOpen){ st.textContent='Ready to sign off'; }
  else { st.textContent='Locked — finish tasks'; }
  updateOverall();
  refreshTracker();
}
function updateOverall(){
  let done=0,tot=0;
  PHASES.forEach(ph=>{ ph.tasks.forEach((_,i)=>{tot++; if(get(key(ph.id,'task',i)))done++;}); ph.gate.forEach((_,i)=>{tot++; if(get(key(ph.id,'gate',i)))done++;}); });
  const pct=tot?Math.round(done/tot*100):0;
  document.getElementById('overallRing').textContent=pct+'%';
}

// ---- nav ----
function showView(id){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view_'+id).classList.add('active');
  document.querySelectorAll('.ptab').forEach(t=>t.classList.toggle('active',t.dataset.view===id));
  if(id==='tracker') refreshTracker();
  if(id==='pricing') recalcPrice();
  window.scrollTo({top:0,behavior:'smooth'});
}

// ---- client name ----
const cn=document.getElementById('clientName');
cn.value=state.clientName||'';
cn.addEventListener('input',()=>{ state.clientName=cn.value; save(); });

// ---- reset ----
document.getElementById('resetBtn').addEventListener('click',()=>{
  if(confirm('Reset all progress for this engagement? This clears every checkbox and fee edit.')){
    state={}; save();
    location.reload();
  }
});

// init UI states
PHASES.forEach(ph=>updatePhase(ph));
showView('p1');
</script>
</body>
</html>
