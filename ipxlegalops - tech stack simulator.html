function renderContent(){

function evisortC(){
if(INTAKE||SUB==='intake'){INTAKE=true;return evisortIntake();}

h+='<table class="tbl"><thead><tr><th style="width:25%">Contract</th><th style="width:14%">Type</th><th style="width:22%">Counterparty</th><th style="width:14%">Status</th><th style="width:10%">Risk</th><th style="width:15%">Alerts</th></tr></thead><tbody>';
C.filter(function(c){if(FILTER==='active')return c.status==='Active';if(FILTER==='pending')return c.status!=='Active';if(FILTER==='high')return c.risk==='High';return true;}).forEach(function(c){h+='<tr onclick="VIEW={type:\'contract\',id:'+c.id+'};DTAB=\'overview\';render()"><td style="font-weight:500">'+c.name+'</td><td><span class="pill p-y">'+c.type+'</span></td><td style="font-size:11px">'+c.cp+'</td><td>'+sp(c.status)+'</td><td>'+sp(c.risk)+'</td><td>'+(c.alerts.length?'<span class="pill p-r">'+c.alerts.filter(function(a){return a.sev==='r'}).length+' critical</span>':'<span class="pill p-g">OK</span>')+'</td></tr>';});
h+='</tbody></table>';return h;
}

if(DTAB==='overview'){h+='<div class="fg"><div class="f"><div class="f-l">Contract type</div><div class="f-v"><span class="pill p-y">'+c.type+'</span></div></div><div class="f"><div class="f-l">Risk level</div><div class="f-v">'+sp(c.risk)+'</div></div><div class="f"><div class="f-l">Counterparty</div><div class="f-v">'+c.cp+'</div></div><div class="f"><div class="f-l">Project</div><div class="f-v">'+c.proj+'</div></div><div class="f"><div class="f-l">Contract value</div><div class="f-v">'+fmt(c.val)+'</div></div><div class="f"><div class="f-l">Status</div><div class="f-v">'+sp(c.status)+'</div></div><div class="f"><div class="f-l">Department</div><div class="f-v">'+c.dept+'</div></div><div class="f"><div class="f-l">Signing authority</div><div class="f-v">'+c.sigs+'</div></div></div>';}
else if(DTAB==='dates'){h+='<div class="fg"><div class="f"><div class="f-l">Effective</div><div class="f-v">'+(c.eff||'Pending')+'</div></div><div class="f"><div class="f-l">Expiration</div><div class="f-v">'+(c.exp||'TBD')+'</div></div><div class="f"><div class="f-l">COD</div><div class="f-v">'+(c.cod||'N/A')+'</div></div><div class="f"><div class="f-l">Next renewal</div><div class="f-v">'+(c.type==='Land lease'?'2029-11-01':'N/A')+'</div></div></div>';if(c.cod){h+='<div class="divider"></div><div class="f-l" style="margin-bottom:6px">COD countdown</div><div class="progress-bar"><div class="progress-fill pf-a" style="width:62%"></div></div><div style="display:flex;justify-content:space-between;font-size:10px;color:#888;margin-top:4px"><span>'+(c.eff||'TBD')+'</span><span>COD: '+c.cod+'</span></div>';}}
else if(DTAB==='alerts'){if(c.alerts.length){c.alerts.forEach(function(a){h+='<div class="a-row"><div class="a-dot" style="background:'+(a.sev==='r'?'#e53935':'#ef6c00')+'"></div><span style="font-weight:500;min-width:55px;color:'+(a.sev==='r'?'#c23030':'#e65100')+'">'+a.days+' days</span><span style="color:#666">'+a.label+'</span></div>';});}else h+='<div class="empty"><i class="ti ti-check" style="font-size:28px;color:#43a047;display:block;margin-bottom:6px"></i>No active alerts</div>';}
else if(DTAB==='spend'){var p=pct(c.spent,c.budget);h+='<div class="fg"><div class="f"><div class="f-l">Budget</div><div class="f-v">'+(c.budget?fmt(c.budget):'N/A')+'</div></div><div class="f"><div class="f-l">Spent</div><div class="f-v">'+(c.spent?fmt(c.spent):'$0')+'</div></div></div>';if(c.budget){h+='<div style="margin-top:10px"><div class="f-l" style="margin-bottom:4px">Budget utilization — '+p+'%</div><div class="progress-bar"><div class="progress-fill '+(p>90?'pf-r':p>70?'pf-a':'pf-g')+'" style="width:'+p+'%"></div></div></div>';}}
else{h+='<div style="display:flex;flex-wrap:wrap;gap:8px"><button class="btn btn-blu" onclick="showToast(\'DocuSign envelope created\',\'s\')"><i class="ti ti-writing-sign"></i>Send to DocuSign</button><button class="btn" onclick="showToast(\'Copied to Relativity\',\'s\')"><i class="ti ti-copy"></i>Copy to Relativity</button><button class="btn" onclick="showToast(\'Reminder sent via Slack\',\'s\')"><i class="ti ti-message"></i>Nudge attorney</button><button class="btn" onclick="showToast(\'Exported\',\'s\')"><i class="ti ti-download"></i>Export</button></div>';}

function evisortObl(){var all=[];C.forEach(function(c){c.alerts.forEach(function(a){all.push({cn:c.name,proj:c.proj,days:a.days,label:a.label,sev:a.sev})})});all.sort(function(a,b){return a.days-b.days});var h='<div style="font-size:15px;font-weight:600;margin-bottom:14px">All obligations — by urgency</div><table class="tbl"><thead><tr><th style="width:8%">Days</th><th style="width:24%">Contract</th><th style="width:16%">Project</th><th style="width:40%">Obligation</th><th style="width:12%">Severity</th></tr></thead><tbody>';all.forEach(function(a){h+='<tr><td style="font-weight:600;color:'+(a.sev==='r'?'#c23030':'#e65100')+'">'+a.days+'</td><td>'+a.cn+'</td><td style="font-size:11px">'+a.proj+'</td><td style="font-size:11px">'+a.label+'</td><td>'+(a.sev==='r'?'<span class="pill p-r">Critical</span>':'<span class="pill p-a">Warning</span>')+'</td></tr>';});h+='</tbody></table>';return h;}

function evisortIntake(){var h='<div class="detail-panel"><div class="dp-header"><div class="dp-title"><i class="ti ti-plus" style="margin-right:6px"></i>New contract intake</div><button class="btn" onclick="INTAKE=false;SUB=\'dashboard\';render()"><i class="ti ti-x"></i>Cancel</button></div><div class="dp-body"><div class="form-grid"><div class="form-r"><label>Contract type</label><select id="fi-type"><option>NDA / confidentiality</option><option>Vendor / service agreement</option><option>Outside counsel engagement</option><option>PPA</option><option>Land lease / easement</option><option>EPC</option><option>Interconnection</option><option>O&M agreement</option><option>Project finance</option></select></div><div class="form-r"><label>Counterparty</label><input id="fi-cp" placeholder="Legal entity name"/></div><div class="form-r"><label>Requesting department</label><select><option>Development — CAISO</option><option>Development — ERCOT</option><option>Operations</option><option>Finance</option><option>Procurement</option><option>Legal</option></select></div><div class="form-r"><label>Project</label><select id="fi-proj"><option>Darden Solar</option><option>Mesquite Storage</option><option>Clearwater Solar</option><option>Red Bluff Wind</option><option>General</option></select></div><div class="form-r"><label>Estimated value ($)</label><input id="fi-val" placeholder="0" type="number"/></div><div class="form-r"><label>Target date</label><input type="date" id="fi-date"/></div></div><div class="form-r"><label>Notes</label><textarea placeholder="Urgency, context, counterparty paper vs template..."></textarea></div><div style="display:flex;gap:8px;margin-top:8px"><button class="btn btn-pri" onclick="doIntake()"><i class="ti ti-check"></i>Submit intake</button><button class="btn" onclick="INTAKE=false;SUB=\'dashboard\';render()">Cancel</button></div></div></div>';return h;}

function doIntake(){var cp=document.getElementById('fi-cp');if(!cp||!cp.value.trim()){showToast('Counterparty name is required','e');return;}var t=document.getElementById('fi-type').value.split(' /')[0];C.push({id:C.length+1,name:t+' — '+cp.value.trim(),type:t,cp:cp.value.trim(),proj:document.getElementById('fi-proj').value,val:parseFloat(document.getElementById('fi-val').value)||0,status:'In review',risk:t==='NDA'?'Low':'Medium',eff:null,exp:null,cod:null,dept:'Development — CAISO',atty:'Unassigned',alerts:[],sigs:'TBD',budget:0,spent:0});INTAKE=false;SUB='dashboard';showToast('Intake submitted — routed to attorney queue','s');}

function brightflagC(){
if(VIEW&&VIEW.type==='invoice')return bfDetail(VIEW.id);
if(SUB==='guidelines')return bfGuidelines();
if(SUB==='ap-feed')return bfApFeed();
var pend=INV.filter(function(i){return!BF_ACTIONS[i.id]}).length,fl=0,tot=0;INV.forEach(function(i){tot+=i.total;i.lines.forEach(function(l){if(l.f)fl++})});
var h='<div class="mets"><div class="met"><div class="met-l">Pending review</div><div class="met-v" style="color:#e65100">'+pend+'</div></div><div class="met"><div class="met-l">Flagged items</div><div class="met-v" style="color:#c23030">'+fl+'</div></div><div class="met"><div class="met-l">Total billable</div><div class="met-v">'+fmt(tot)+'</div></div><div class="met"><div class="met-l">Invoices (LEDES)</div><div class="met-v">'+INV.length+'</div></div></div>';
h+='<div class="info-strip info-blu"><strong>Invoice format:</strong> All invoices arrive in LEDES format with UTBMS task/activity codes. Brightflag AI parses every line item and checks against IPX billing guidelines automatically.</div>';
h+='<table class="tbl"><thead><tr><th style="width:12%">Invoice</th><th style="width:22%">Firm</th><th style="width:22%">Matter</th><th style="width:14%">Amount</th><th style="width:14%">Flags</th><th style="width:16%">Status</th></tr></thead><tbody>';
INV.forEach(function(i){var st=BF_ACTIONS[i.id],sl=st==='approved'?'Approved':st==='rejected'?'Rejected':'Pending review',fc=i.lines.filter(function(l){return l.f}).length;h+='<tr onclick="VIEW={type:\'invoice\',id:\''+i.id+'\'};render()"><td style="font-weight:500">'+i.id+'</td><td>'+i.firm+'</td><td style="font-size:11px">'+i.matter+'</td><td>'+fmt(i.total)+'</td><td>'+(fc?'<span class="pill p-r"><i class="ti ti-alert-triangle" style="font-size:10px;margin-right:2px"></i>'+fc+'</span>':'<span class="pill p-g">Clean</span>')+'</td><td>'+sp(sl)+'</td></tr>';});
h+='</tbody></table>';return h;
}

function bfDetail(invId){var inv=INV.find(function(x){return x.id===invId}),st=BF_ACTIONS[inv.id],fc=inv.lines.filter(function(l){return l.f}).length,cl=inv.lines.filter(function(l){return!l.f}).length;
var h='<div class="detail-panel"><div class="dp-header"><div><div class="dp-title">'+inv.id+'</div><div class="dp-sub">'+inv.firm+' · '+inv.matter+' · Submitted '+inv.date+' · Due '+inv.due+'</div></div><button class="btn" onclick="VIEW=null;render()"><i class="ti ti-arrow-left"></i>Back</button></div><div style="display:flex;gap:16px;padding:10px 20px;border-bottom:1px solid #e8eaed;font-size:12px"><span><b>'+inv.lines.length+'</b> line items</span><span style="color:#ccc">·</span><span style="color:#1b5e20"><b>'+cl+'</b> clean</span><span style="color:#ccc">·</span><span style="color:#b71c1c"><b>'+fc+'</b> flagged</span><span style="color:#ccc">·</span><span><b>Total: '+fmt(inv.total)+'</b></span></div><div class="dp-body">';
inv.lines.forEach(function(l){h+='<div class="li"><div><div class="li-main">'+(l.f?'<i class="ti ti-alert-triangle" style="color:#c23030;font-size:13px;margin-right:4px"></i>':'')+l.d+'</div><div class="li-meta">UTBMS: '+l.c+(l.h?' · '+l.h+'h @ '+fmt(l.r)+'/hr':' · Expense')+'</div></div><div style="text-align:right;font-weight:500">'+fmt(l.a)+'</div><div>'+(l.f?'<span class="pill p-r" style="font-size:9px">'+l.f+'</span>':'<span class="pill p-g" style="font-size:9px">OK</span>')+'</div></div>';});
h+='<div class="divider"></div>';
if(!st){h+='<div style="display:flex;gap:8px"><button class="btn btn-grn" onclick="BF_ACTIONS[\''+inv.id+'\']=\'approved\';showToast(\''+inv.id+' approved → routed to Stampli for GL coding\',\'s\');VIEW=null;render()"><i class="ti ti-check"></i>Approve</button><button class="btn btn-red" onclick="BF_ACTIONS[\''+inv.id+'\']=\'rejected\';showToast(\''+inv.id+' rejected → returned to '+inv.firm+'\',\'e\');VIEW=null;render()"><i class="ti ti-x"></i>Reject</button><button class="btn"><i class="ti ti-message"></i>Request clarification</button></div>';}
else{h+='<div class="pill '+(st==='approved'?'p-g':'p-r')+'" style="font-size:12px;padding:6px 12px">'+(st==='approved'?'Approved — in Stampli queue':'Rejected — returned to '+inv.firm)+'</div>';}
h+='</div></div>';return h;}

function bfGuidelines(){return '<div style="font-size:15px;font-weight:600;margin-bottom:14px">IPX Power — outside counsel billing guidelines</div><div class="info-strip info-red"><strong>Enforced automatically by Brightflag AI on every LEDES invoice submission.</strong></div><div class="detail-panel"><div class="dp-body"><div class="guideline-item"><div class="g-dot" style="background:#e53935"></div><div><div style="font-weight:500">Administrative work is prohibited</div><div style="color:#888;margin-top:2px">Filing, copying, scanning, document organization — UTBMS codes L610, X110</div></div></div><div class="guideline-item"><div class="g-dot" style="background:#e53935"></div><div><div style="font-weight:500">Travel requires pre-approval</div><div style="color:#888;margin-top:2px">All travel must be approved in writing by the supervising IPX attorney before incurred</div></div></div><div class="guideline-item"><div class="g-dot" style="background:#e53935"></div><div><div style="font-weight:500">First-year associate rate cap: $650/hr</div><div style="color:#888;margin-top:2px">Brightflag flags any timekeeper classified as 1st-year billing above this threshold</div></div></div><div class="guideline-item"><div class="g-dot" style="background:#e53935"></div><div><div style="font-weight:500">Block billing is prohibited</div><div style="color:#888;margin-top:2px">Every task must be separately itemized — combined entries are rejected</div></div></div><div class="guideline-item"><div class="g-dot" style="background:#ef6c00"></div><div><div style="font-weight:500">Rate increases require 60-day notice</div><div style="color:#888;margin-top:2px">Written notice and IPX approval required before any rate change takes effect</div></div></div><div class="guideline-item"><div class="g-dot" style="background:#ef6c00"></div><div><div style="font-weight:500">LEDES format required</div><div style="color:#888;margin-top:2px">All invoices must be submitted via Brightflag in LEDES format function bfApFeed(){return '<div style="font-size:15px;font-weight:600;margin-bottom:14px">AP integration — Brightflag → Stampli</div><div class="info-strip info-pur"><strong>Three integration methods available.</strong> IPX Power\'s specific method should be confirmed with Janelle during onboarding.</div><div class="detail-panel"><div class="dp-body"><div class="a-row"><div class="a-dot" style="background:#1565c0"></div><div><div style="font-weight:500">Method 1: Email</div><div style="color:#888;font-size:11px;margin-top:2px">Approved invoices emailed to AP mailbox. Simplest setup, requires manual AP processing.</div></div></div><div class="divider"></div><div class="a-row"><div class="a-dot" style="background:#1565c0"></div><div><div style="font-weight:500">Method 2: SFTP batch export</div><div style="color:#888;font-size:11px;margin-top:2px">Automated batch file uploaded to SFTP server. AP system retrieves and processes. Semi-automated.</div></div></div><div class="divider"></div><div class="a-row"><div class="a-dot" style="background:#1565c0"></div><div><div style="font-weight:500">Method 3: API (most automated)</div><div style="color:#888;font-size:11px;margin-top:2px">Real-time API integration. Invoices sent automatically with error handling. Requires IT setup.</div></div></div><div class="divider"></div><div class="a-row"><div class="a-dot" style="background:#43a047"></div><div><div style="font-weight:500">AP reverse feed</div><div style="color:#888;font-size:11px;margin-top:2px">Stampli sends payment status back to Brightflag. Invoice records updated automatically — no need to check two systems.</div></div></div></div></div>';}

function stampliC(){
var nc=STQ.filter(function(s){return s.st==='Needs coding'&&!ST_CODED[s.id]}).length,ip=STQ.filter(function(s){return s.st==='In payment'||ST_CODED[s.id]}).length,pd=STQ.filter(function(s){return s.st==='Paid'}).length,tot=0;STQ.forEach(function(s){tot+=s.total});
if(SUB==='billy')return stampBilly();
var h='<div class="mets"><div class="met"><div class="met-l">Needs coding</div><div class="met-v" style="color:#e65100">'+nc+'</div></div><div class="met"><div class="met-l">In payment</div><div class="met-v">'+ip+'</div></div><div class="met"><div class="met-l">Paid</div><div class="met-v" style="color:#2d7a3a">'+pd+'</div></div><div class="met"><div class="met-l">Pipeline total</div><div class="met-v">'+fmt(tot)+'</div></div></div>';
h+='<table class="tbl"><thead><tr><th style="width:12%">Invoice</th><th style="width:20%">Firm</th><th style="width:18%">Project</th><th style="width:12%">Amount</th><th style="width:16%">Code</th><th style="width:10%">Date</th><th style="width:12%">Status</th></tr></thead><tbody>';
STQ.forEach(function(s){var coded=ST_CODED[s.id],st=coded?'In payment':s.st;h+='<tr><td style="font-weight:500">'+s.id+'</td><td style="font-size:11px">'+s.firm+'</td><td style="font-size:11px">'+s.proj+'</td><td>'+fmt(s.total)+'</td><td>';if(st==='Needs coding'){h+='<select onchange="doCode(\''+s.id+'\',this.value)" style="font-size:11px;width:100px;padding:4px 6px;border:1px solid #e2e4e8;border-radius:6px"><option value="">Assign...</option>';PCS.forEach(function(pc){h+='<option>'+pc+'</option>'});h+='</select>';}else h+='<span style="font-weight:500;font-size:11px">'+(coded||s.pc)+'</span>';h+='</td><td style="font-size:11px;color:#888">'+s.date+'</td><td>'+sp(st)+'</td></tr>';});
h+='</tbody></table>';
var bfa=INV.filter(function(i){return BF_ACTIONS[i.id]==='approved'});
if(bfa.length){h+='<div class="divider"></div><div style="font-size:13px;font-weight:600;margin-bottom:10px"><i class="ti ti-arrow-down" style="margin-right:4px"></i>Incoming from Brightflag</div>';bfa.forEach(function(i){var coded=ST_CODED[i.id];h+='<div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f0f1f3;font-size:12px"><div><span style="font-weight:500">'+i.id+'</span> · '+i.firm+' · '+fmt(i.total)+'</div>';if(!coded){h+='<select onchange="doCode(\''+i.id+'\',this.value)" style="font-size:11px;width:100px;padding:4px 6px;border:1px solid #e2e4e8;border-radius:6px"><option value="">Assign...</option>';PCS.forEach(function(pc){h+='<option>'+pc+'</option>'});h+='</select>';}else h+='<span class="pill p-g">'+coded+'</span>';h+='</div>';});}
return h;
}

function doCode(id,c){if(!c)return;ST_CODED[id]=c;showToast(id+' coded to '+c+' → routed to AP for payment','s');}

function stampBilly(){return '<div style="font-size:15px;font-weight:600;margin-bottom:14px"><i class="ti ti-robot" style="margin-right:6px"></i>Billy AI assistant</div><div class="info-strip info-pur"><strong>Billy is Stampli\'s AI.</strong> It learns your AP processes and automates tasks.</div><div class="detail-panel"><div class="dp-body"><div class="a-row"><div class="a-dot" style="background:#4527a0"></div><div><strong>Invoice capture</strong> — automatically extracts key data from incoming invoices</div></div><div class="divider"></div><div class="a-row"><div class="a-dot" style="background:#4527a0"></div><div><strong>GL code suggestions</strong> — learns from ERP coding history to suggest project codes</div></div><div class="divider"></div><div class="a-row"><div class="a-dot" style="background:#4527a0"></div><div><strong>Approval routing</strong> — automatically routes to correct approvers based on rules</div></div><div class="divider"></div><div class="a-row"><div class="a-dot" style="background:#4527a0"></div><div><strong>Duplicate detection</strong> — flags potential duplicate invoices before processing</div></div><div class="divider"></div><div class="a-row"><div class="a-dot" style="background:#4527a0"></div><div><strong>Fraud detection</strong> — identifies anomalies in invoice patterns</div></div></div></div>';}

function relativityC(){if(RFOLDER!==null)return relDocs(RFOLDER);if(SUB==='air')return relAir();var td=0;REL.forEach(function(m){td+=m.docs.length});var h='<div class="mets"><div class="met"><div class="met-l">Active matters</div><div class="met-v">'+REL.length+'</div></div><div class="met"><div class="met-l">Total documents</div><div class="met-v">'+td+'</div></div><div class="met"><div class="met-l">Pending review</div><div class="met-v">2</div></div><div class="met"><div class="met-l">Last updated</div><div class="met-v" style="font-size:14px">Jun 5</div></div></div>';
h+='<div class="info-strip info-amb"><strong>No native sync with Brightflag.</strong> Documents are manually uploaded here from Evisort for litigation-relevant matters. Brightflag tracks the spend; Relativity manages the documents.</div>';
h+='<div style="font-size:14px;font-weight:600;margin-bottom:10px">Matter workspaces</div>';REL.forEach(function(m,i){h+='<div class="folder-card" onclick="RFOLDER='+i+';render()"><div class="folder-icon '+m.color+'"><i class="ti '+m.icon+'"></i></div><div style="flex:1;min-width:0"><div class="folder-name">'+m.name+'</div><div class="folder-meta">'+m.docs.length+' documents · '+m.id+'</div></div><i class="ti ti-chevron-right" style="color:#888"></i></div>';});
h+='<div style="margin-top:12px"><button class="btn btn-pri" onclick="showToast(\'New workspace created\',\'s\')"><i class="ti ti-plus"></i>New workspace</button></div>';return h;}

function relDocs(idx){var m=REL[idx];var h='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><div style="font-size:15px;font-weight:600"><i class="ti '+m.icon+'" style="margin-right:6px"></i>'+m.name+'</div><button class="btn" onclick="RFOLDER=null;render()"><i class="ti ti-arrow-left"></i>All matters</button></div><div style="display:flex;gap:6px;margin-bottom:12px"><button class="btn btn-blu" onclick="showToast(\'Upload dialog opened\',\'i\')"><i class="ti ti-upload"></i>Upload</button><button class="btn"><i class="ti ti-search"></i>Search</button><button class="btn"><i class="ti ti-filter"></i>Filter</button></div>';
h+='<div style="border:1px solid #e8eaed;border-radius:10px;overflow:hidden"><div class="doc-item" style="background:#f8f9fb;font-size:10px;color:#888;font-weight:500;text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid #e8eaed"><span></span><span>Document</span><span>Type</span><span>Date</span><span>Size</span></div>';m.docs.forEach(function(d){var ic=d.t==='PDF'?'ti-file-type-pdf':d.t==='DOCX'?'ti-file-type-doc':'ti-file-spreadsheet';h+='<div class="doc-item"><i class="'+ic+'"></i><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+d.n+'</span><span class="pill p-y">'+d.t+'</span><span style="color:#888;font-size:11px">'+d.d+'</span><span style="color:#888;font-size:11px">'+d.s+'</span></div>';});h+='</div>';return h;}

function relAir(){return '<div style="font-size:15px;font-weight:600;margin-bottom:14px"><i class="ti ti-robot" style="margin-right:6px"></i>aiR for review</div><div class="info-strip info-amb"><strong>Relativity aiR</strong> uses AI to accelerate document review — conceptual search, privilege detection, and automated categorization.</div><div class="detail-panel"><div class="dp-body"><div class="a-row"><div class="a-dot" style="background:#bf360c"></div><div><strong>Conceptual search</strong> — finds relevant documents by meaning, not just keywords</div></div><div class="divider"></div><div class="a-row"><div class="a-dot" style="background:#bf360c"></div><div><strong>Document prioritization</strong> — surfaces the most relevant documents first</div></div><div class="divider"></div><div class="a-row"><div class="a-dot" style="background:#bf360c"></div><div><strong>Privilege detection</strong> — flags potentially privileged communications automatically</div></div><div class="divider"></div><div class="a-row"><div class="a-dot" style="background:#bf360c"></div><div><strong>Impact on billing</strong> — fewer attorney review hours = smaller invoices in Brightflag. If AI is doing first-pass review, 500-hour associate billings on review matters should be flagged.</div></div></div></div>';}

function render(){renderSidebar();renderContent();}
render();
</script>
