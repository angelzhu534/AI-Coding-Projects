
<h2 class="sr-only">Interactive simulator of four legal ops platforms used at IPX Power: Evisort, Brightflag, Stampli, and Relativity.</h2>
<style>
*{box-sizing:border-box;margin:0;padding:0}
.ptabs{display:flex;border-bottom:0.5px solid var(--color-border-tertiary);margin-bottom:0}
.ptab{padding:10px 16px;font-size:13px;font-weight:500;cursor:pointer;border:none;background:none;color:var(--color-text-secondary);border-bottom:2px solid transparent;font-family:inherit;transition:all .15s}
.ptab.act{color:var(--color-text-primary);border-bottom-color:var(--color-text-primary)}
.ptab:hover{color:var(--color-text-primary)}
.pbar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--color-background-secondary);border-bottom:0.5px solid var(--color-border-tertiary)}
.pbar-t{font-size:15px;font-weight:500}
.pbar-s{font-size:12px;color:var(--color-text-secondary)}
.body{padding:16px}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.met{background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:10px 12px}
.met-l{font-size:11px;color:var(--color-text-secondary);margin-bottom:2px}
.met-v{font-size:18px;font-weight:500}
.sub-tabs{display:flex;gap:4px;margin-bottom:12px}
.sub-tab{padding:4px 10px;border-radius:14px;font-size:11px;cursor:pointer;border:0.5px solid var(--color-border-tertiary);background:var(--color-background-primary);color:var(--color-text-secondary);font-family:inherit}
.sub-tab.act{background:var(--color-text-primary);color:var(--color-background-primary);border-color:var(--color-text-primary)}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{text-align:left;padding:8px 6px;color:var(--color-text-secondary);font-weight:500;border-bottom:0.5px solid var(--color-border-tertiary);font-size:11px}
.tbl td{padding:8px 6px;border-bottom:0.5px solid var(--color-border-tertiary);color:var(--color-text-primary);vertical-align:top}
.tbl tr:last-child td{border-bottom:none}
.tbl tr{cursor:pointer;transition:background .1s}
.tbl tr:hover td{background:var(--color-background-secondary)}
.pill{display:inline-block;font-size:10px;padding:2px 7px;border-radius:10px;font-weight:500}
.p-grn{background:#EAF3DE;color:#3B6D11}.p-red{background:#FCEBEB;color:#A32D2D}.p-amb{background:#FAEEDA;color:#854F0B}.p-blu{background:#E6F1FB;color:#185FA5}.p-gry{background:var(--color-background-secondary);color:var(--color-text-secondary)}.p-pur{background:#EEEDFE;color:#3C3489}
.detail{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:16px;margin-bottom:12px}
.detail-h{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.detail-t{font-size:15px;font-weight:500}
.back-btn{font-size:12px;cursor:pointer;border:0.5px solid var(--color-border-secondary);background:none;padding:4px 10px;border-radius:var(--border-radius-md);color:var(--color-text-secondary);font-family:inherit}
.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.field{margin-bottom:8px}
.field-l{font-size:11px;color:var(--color-text-secondary);margin-bottom:1px}
.field-v{font-size:13px;color:var(--color-text-primary)}
.sep{height:0.5px;background:var(--color-border-tertiary);margin:12px 0}
.alert-row{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:12px}
.alert-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.act-btn{padding:6px 14px;border-radius:var(--border-radius-md);font-size:12px;cursor:pointer;font-family:inherit;border:none;font-weight:500;transition:all .15s}
.btn-approve{background:#EAF3DE;color:#3B6D11}.btn-reject{background:#FCEBEB;color:#A32D2D}.btn-code{background:#E6F1FB;color:#185FA5}.btn-disabled{background:var(--color-background-secondary);color:var(--color-text-secondary);cursor:default}
.line-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:0.5px solid var(--color-border-tertiary);font-size:12px}
.line-item:last-child{border-bottom:none}
.li-flag{display:flex;align-items:center;gap:6px}
.toast{position:relative;padding:10px 14px;border-radius:var(--border-radius-md);margin-bottom:10px;font-size:12px;font-weight:500;animation:fadeIn .3s}
.toast-s{background:#EAF3DE;color:#3B6D11}.toast-e{background:#FCEBEB;color:#A32D2D}
@keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.form-row{margin-bottom:12px}
.form-row label{display:block;font-size:11px;color:var(--color-text-secondary);margin-bottom:4px}
.form-row input,.form-row select,.form-row textarea{width:100%;font-size:13px}
.form-row textarea{height:60px;resize:vertical}
.folder{display:flex;align-items:center;gap:8px;padding:10px 12px;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);margin-bottom:6px;cursor:pointer;transition:background .1s;font-size:13px;color:var(--color-text-primary)}
.folder:hover{background:var(--color-background-secondary)}
.folder i{font-size:18px;color:var(--color-text-secondary)}
.doc-row{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-bottom:0.5px solid var(--color-border-tertiary);font-size:12px}
.doc-row:last-child{border-bottom:none}
.coding-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.coding-row select{flex:1;font-size:12px}
.coding-row span{font-size:12px;min-width:80px}
</style>

function submitIntake(){
var cp=document.getElementById('f-cp');var val=document.getElementById('f-val');
if(!cp||!cp.value.trim()){S.toasts=[{msg:'Counterparty name is required',type:'error'}];render();return;}
var t=document.getElementById('f-type').value;var p=document.getElementById('f-proj').value;
contracts.push({id:contracts.length+1,name:t+' — '+cp.value.trim(),type:t,counterparty:cp.value.trim(),project:p,value:val.value||'TBD',status:'In review',risk:t==='NDA'?'Low':'Medium',effective:'Pending',expiry:'TBD',cod:'N/A',alerts:[],sigs:'TBD'});
S.sub='dashboard';S.toasts=[{msg:'Contract submitted and routed to attorney queue',type:'success'}];render();
}

if(S.view&&S.view.type==='invoice-detail'){
var inv=invoices.find(function(x){return x.id===S.view.id});
var invStatus=S.invoiceActions[inv.id]||'pending';
h+='<div class="detail"><div class="detail-h"><div><div class="detail-t">'+inv.id+' — '+inv.firm+'</div><div style="font-size:12px;color:var(--color-text-secondary);margin-top:2px">'+inv.matter+' &middot; '+inv.project+' &middot; '+inv.date+'</div></div><button class="back-btn" onclick="S.view=null;render()"><i class="ti ti-arrow-left" aria-hidden="true" style="font-size:14px;margin-right:4px"></i>Back</button></div>';
h+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><div style="font-size:14px;font-weight:500">Line items</div><div style="font-size:14px;font-weight:500">Total: '+fmt(inv.total)+'</div></div>';
inv.lines.forEach(function(l,idx){
h+='<div class="line-item"><div style="flex:1"><div style="margin-bottom:2px">'+l.desc+'</div><div style="font-size:11px;color:var(--color-text-secondary)">'+(l.hrs?l.hrs+'h @ '+fmt(l.rate)+'/hr':'Expense')+' &middot; Code: '+l.code+'</div></div><div class="li-flag">';
if(l.flag){h+='<span class="pill p-red" style="font-size:10px"><i class="ti ti-alert-triangle" aria-hidden="true" style="font-size:12px;margin-right:2px"></i>'+l.flag+'</span>';}
h+='<span style="font-weight:500;min-width:60px;text-align:right">'+fmt(l.amt)+'</span></div></div>';
});
if(invStatus==='pending'){
h+='<div class="sep"></div><div style="display:flex;gap:8px"><button class="act-btn btn-approve" onclick="S.invoiceActions[\''+inv.id+'\']=\'approved\';S.toasts=[{msg:\'Invoice approved — routed to Stampli for coding\',type:\'success\'}];S.view=null;render()"><i class="ti ti-check" aria-hidden="true" style="font-size:14px;margin-right:4px"></i>Approve invoice</button><button class="act-btn btn-reject" onclick="S.invoiceActions[\''+inv.id+'\']=\'rejected\';S.toasts=[{msg:\'Invoice rejected — returned to firm with flags\',type:\'error\'}];S.view=null;render()"><i class="ti ti-x" aria-hidden="true" style="font-size:14px;margin-right:4px"></i>Reject and return to firm</button></div>';
} else {
h+='<div class="sep"></div><div class="pill '+(invStatus==='approved'?'p-grn':'p-red')+'" style="font-size:12px;padding:4px 10px">'+(invStatus==='approved'?'Approved — in Stampli queue':'Rejected — returned to firm')+'</div>';
}
h+='</div>';
} else {
h+='<table class="tbl"><thead><tr><th>Invoice</th><th>Firm</th><th>Matter</th><th>Amount</th><th>Flags</th><th>Status</th></tr></thead><tbody>';
invoices.forEach(function(i){
var st=S.invoiceActions[i.id]||'pending';
var stLabel=st==='approved'?'Approved':st==='rejected'?'Rejected':'Pending review';
var fc=i.lines.filter(function(l){return l.flag}).length;
h+='<tr onclick="S.view={type:\'invoice-detail\',id:\''+i.id+'\'};S.toasts=[];render()"><td style="font-weight:500">'+i.id+'</td><td>'+i.firm+'</td><td style="font-size:11px">'+i.matter+'</td><td>'+fmt(i.total)+'</td><td>'+(fc?'<span class="pill p-red">'+fc+' flags</span>':'<span class="pill p-grn">Clean</span>')+'</td><td>'+statusPill(stLabel)+'</td></tr>'});
h+='</tbody></table>';
}
h+='</div>';return h;
}

function renderStampli(){
var h=toastHtml();
h+='<div class="pbar"><div><div class="pbar-t"><i class="ti ti-credit-card" aria-hidden="true" style="margin-right:6px;font-size:16px"></i>Stampli</div><div class="pbar-s">AP and invoice processing</div></div><div class="pbar-s">Payment pipeline</div></div>';
h+='<div class="body">';
var nc=stampliQueue.filter(function(s){return s.status==='Needs coding'&&!S.stampliCoded[s.id]}).length;
var ip=stampliQueue.filter(function(s){return s.status==='Coded — in payment'||S.stampliCoded[s.id]}).length;
var paid=stampliQueue.filter(function(s){return s.status==='Paid'}).length;
var tot=0;stampliQueue.forEach(function(s){tot+=s.total});
h+='<div class="metrics"><div class="met"><div class="met-l">Needs coding</div><div class="met-v" style="color:#854F0B">'+nc+'</div></div><div class="met"><div class="met-l">In payment</div><div class="met-v">'+ip+'</div></div><div class="met"><div class="met-l">Paid</div><div class="met-v" style="color:#3B6D11">'+paid+'</div></div><div class="met"><div class="met-l">Pipeline total</div><div class="met-v">'+fmt(tot)+'</div></div></div>';
h+='<table class="tbl"><thead><tr><th>Invoice</th><th>Firm</th><th>Project</th><th>Amount</th><th>Project code</th><th>Status</th></tr></thead><tbody>';
stampliQueue.forEach(function(s){
var coded=S.stampliCoded[s.id];
var st=coded?'Coded — in payment':s.status;
h+='<tr><td style="font-weight:500">'+s.id+'</td><td>'+s.firm+'</td><td style="font-size:11px">'+s.project+'</td><td>'+fmt(s.total)+'</td><td>';
if(st==='Needs coding'){
h+='<select onchange="codeInvoice(\''+s.id+'\',this.value)" style="font-size:11px;width:100px"><option value="">Select...</option>';
projCodes.forEach(function(pc,i){h+='<option value="'+pc+'">'+pc+'</option>'});
h+='<option value="GEN-REG">GEN-REG</option></select>';
} else {
h+='<span style="font-size:11px;font-weight:500">'+(coded||s.projCode)+'</span>';
}
h+='</td><td>'+statusPill(st)+'</td></tr>';
});
h+='</tbody></table>';
var approvedFromBF=[];
invoices.forEach(function(i){if(S.invoiceActions[i.id]==='approved'){approvedFromBF.push(i)}});
if(approvedFromBF.length){
h+='<div class="sep" style="margin:16px 0"></div><div style="font-size:13px;font-weight:500;margin-bottom:8px"><i class="ti ti-arrow-right" aria-hidden="true" style="font-size:14px;margin-right:4px"></i>Newly approved from Brightflag</div>';
approvedFromBF.forEach(function(i){
var coded=S.stampliCoded[i.id];
h+='<div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:0.5px solid var(--color-border-tertiary);font-size:12px"><div><span style="font-weight:500">'+i.id+'</span> — '+i.firm+' &middot; '+fmt(i.total)+'</div>';
if(!coded){h+='<select onchange="codeInvoice(\''+i.id+'\',this.value)" style="font-size:11px;width:100px"><option value="">Code to...</option>';projCodes.forEach(function(pc){h+='<option value="'+pc+'">'+pc+'</option>'});h+='<option value="GEN-REG">GEN-REG</option></select>';}
else{h+='<span class="pill p-grn">Coded: '+coded+'</span>';}
h+='</div>';
});
}
h+='</div>';return h;
}

function codeInvoice(id,code){
if(!code)return;
S.stampliCoded[id]=code;
S.toasts=[{msg:id+' coded to '+code+' — routed to payment',type:'success'}];
render();
}

function renderRelativity(){
var h=toastHtml();
h+='<div class="pbar"><div><div class="pbar-t"><i class="ti ti-scale" aria-hidden="true" style="margin-right:6px;font-size:16px"></i>Relativity</div><div class="pbar-s">Ediscovery and litigation archive</div></div><div class="pbar-s">IPX Power workspace</div></div>';
h+='<div class="body">';
if(S.relFolder!==null){
var m=relMatters[S.relFolder];
h+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><div style="font-size:14px;font-weight:500"><i class="ti ti-folder" aria-hidden="true" style="margin-right:6px;font-size:16px"></i>'+m.name+'</div><button class="back-btn" onclick="S.relFolder=null;render()"><i class="ti ti-arrow-left" aria-hidden="true" style="font-size:14px;margin-right:4px"></i>Back</button></div>';
h+='<div style="font-size:12px;color:var(--color-text-secondary);margin-bottom:12px">'+m.docs.length+' documents</div>';
h+='<div style="border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);overflow:hidden">';
h+='<div style="display:grid;grid-template-columns:1fr 60px 90px 70px;padding:8px 10px;background:var(--color-background-secondary);font-size:11px;color:var(--color-text-secondary);font-weight:500;border-bottom:0.5px solid var(--color-border-tertiary)"><span>Document</span><span>Type</span><span>Date</span><span>Size</span></div>';
m.docs.forEach(function(d){
h+='<div style="display:grid;grid-template-columns:1fr 60px 90px 70px;padding:8px 10px;border-bottom:0.5px solid var(--color-border-tertiary);font-size:12px;align-items:center"><span style="display:flex;align-items:center;gap:6px"><i class="ti ti-file" aria-hidden="true" style="font-size:14px;color:var(--color-text-secondary)"></i>'+d.n+'</span><span class="pill p-gry">'+d.type+'</span><span style="color:var(--color-text-secondary)">'+d.date+'</span><span style="color:var(--color-text-secondary)">'+d.size+'</span></div>';
});
h+='</div>';
h+='<div style="margin-top:12px;display:flex;gap:8px"><button class="act-btn btn-code" onclick="S.toasts=[{msg:\'Upload dialog opened — select files to add to this matter\',type:\'success\'}];render()"><i class="ti ti-upload" aria-hidden="true" style="font-size:14px;margin-right:4px"></i>Upload document</button><button class="act-btn" style="background:var(--color-background-secondary);color:var(--color-text-primary)"><i class="ti ti-search" aria-hidden="true" style="font-size:14px;margin-right:4px"></i>Search within matter</button></div>';
} else {
h+='<div style="font-size:13px;font-weight:500;margin-bottom:12px">Matter workspaces</div>';
relMatters.forEach(function(m,i){
h+='<div class="folder" onclick="S.relFolder='+i+';S.toasts=[];render()"><i class="ti ti-folder" aria-hidden="true"></i><div style="flex:1"><div>'+m.name+'</div><div style="font-size:11px;color:var(--color-text-secondary)">'+m.docs.length+' documents</div></div><i class="ti ti-chevron-right" aria-hidden="true" style="font-size:14px;color:var(--color-text-secondary)"></i></div>';
});
h+='<div style="margin-top:12px"><button class="act-btn btn-code" onclick="S.toasts=[{msg:\'New matter workspace created\',type:\'success\'}];render()"><i class="ti ti-plus" aria-hidden="true" style="font-size:14px;margin-right:4px"></i>New matter workspace</button></div>';
}
h+='</div>';return h;
}

function render(){
var app=document.getElementById('app');
if(S.platform==='evisort')app.innerHTML=renderEvisort();
else if(S.platform==='brightflag')app.innerHTML=renderBrightflag();
else if(S.platform==='stampli')app.innerHTML=renderStampli();
else app.innerHTML=renderRelativity();
document.querySelectorAll('.ptab').forEach(function(t){t.classList.toggle('act',t.dataset.p===S.platform)});
setTimeout(function(){S.toasts=[]},3000);
}

var nav=document.getElementById('ptabs');
['evisort','brightflag','stampli','relativity'].forEach(function(p){
var b=document.createElement('button');
b.className='ptab'+(p==='evisort'?' act':'');
b.dataset.p=p;
b.textContent=p.charAt(0).toUpperCase()+p.slice(1);
b.onclick=function(){S.platform=p;S.view=null;S.sub='dashboard';S.relFolder=null;S.toasts=[];render()};
nav.appendChild(b);
});
render();
</script>
