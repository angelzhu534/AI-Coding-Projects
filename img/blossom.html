<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="In Full Bloom">
<link rel="manifest" href="./blossom-manifest.json">
<link rel="apple-touch-icon" href="./blossom-icon.svg">
<title>Blossom</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="dns-prefetch" href="https://fancy-boat-5426.angel-zhu534.workers.dev">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@200;300;400&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root {
  --bg:     #f5ede0;
  --bg2:    #ede0cc;
  --terra:  #b85c38;
  --terra-l:#d4835a;
  --gold:   #a07830;
  --sage:   #5a7848;
  --sage-l: #7a9868;
  --cream:  #faf6ee;
  --ink:    #2a1e14;
  --stone:  #6a5a48;
  --dust:   #9a8878;
  --petal:  #e8c0a8;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bot: env(safe-area-inset-bottom, 0px);
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

body {
  background: var(--bg);
  color: var(--ink);
  font-family: 'Jost', 'Helvetica Neue', Arial, sans-serif;
  font-weight: 300;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── HEADER ── */
.app-header {
  position: fixed; top:0; left:0; right:0; z-index:100;
  padding: calc(var(--safe-top) + 14px) 22px 12px;
  background: rgba(245,237,224,.94);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid rgba(168,120,80,.12);
  will-change: transform;
}
.header-inner {
  display: flex; align-items: center; justify-content: space-between;
  max-width: 480px; margin: 0 auto;
}
.app-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 17px; font-weight: 400; font-style: italic;
  color: var(--terra); letter-spacing: .02em;
}
.live-time {
  font-family: 'Jost', 'Helvetica Neue', Arial, sans-serif; font-size: 13px; font-weight: 300;
  color: var(--stone); letter-spacing: .06em;
}

/* ── MAIN ── */
.main {
  padding-top: calc(var(--safe-top) + 70px);
  padding-bottom: calc(var(--safe-bot) + 100px);
  max-width: 480px; margin: 0 auto;
}

/* ── NOW CARD ── */
.now-section { padding: 24px 20px 0; }
.now-label {
  font-family: 'Jost', 'Helvetica Neue', Arial, sans-serif; font-size: 9px; font-weight: 400;
  letter-spacing: .22em; text-transform: uppercase; color: var(--terra);
  margin-bottom: 10px;
}
.now-card {
  background: var(--terra);
  border-radius: 16px;
  padding: 24px 24px 20px;
  position: relative; overflow: hidden;
  box-shadow: 0 8px 32px rgba(184,92,56,.22);
}
.now-card::before {
  content: '';
  position: absolute; top:-30px; right:-30px;
  width: 140px; height: 140px; border-radius: 50%;
  background: rgba(255,255,255,.08);
}
.now-card::after {
  content: '';
  position: absolute; bottom:-20px; left:20px;
  width: 80px; height: 80px; border-radius: 50%;
  background: rgba(255,255,255,.05);
}
.now-time-badge {
  display: inline-block;
  font-family: 'Jost', 'Helvetica Neue', Arial, sans-serif; font-size: 11px; font-weight: 300;
  letter-spacing: .12em; text-transform: uppercase;
  color: rgba(255,255,255,.7); margin-bottom: 10px;
}
.now-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 26px; font-weight: 400; color: #fff;
  line-height: 1.2; margin-bottom: 8px;
}
.now-note {
  font-family: 'Cormorant Garamond', serif;
  font-size: 15px; font-style: italic;
  color: rgba(255,255,255,.8); line-height: 1.65;
  margin-bottom: 18px;
}
.now-tag {
  display: inline-block;
  font-family: 'Jost', 'Helvetica Neue', Arial, sans-serif; font-size: 9px; font-weight: 400;
  letter-spacing: .12em; text-transform: uppercase;
  padding: 3px 10px; border-radius: 20px;
  background: rgba(255,255,255,.18); color: rgba(255,255,255,.9);
  margin-bottom: 18px;
}
.now-actions {
  display: flex; gap: 10px; align-items: center;
}
.btn-play {
  display: flex; align-items: center; gap: 8px;
  background: rgba(255,255,255,.18);
  border: 1px solid rgba(255,255,255,.3);
  border-radius: 50px; padding: 10px 20px;
  font-family: 'Jost', 'Helvetica Neue', Arial, sans-serif; font-size: 12px; font-weight: 400;
  letter-spacing: .08em; color: #fff; cursor: pointer;
  transition: background .2s;
  flex: 1; justify-content: center;
}
.btn-play:active { background: rgba(255,255,255,.28); }
.btn-play .play-icon { font-size: 14px; }
.btn-next {
  display: flex; align-items: center;
  background: rgba(255,255,255,.1);
  border: 1px solid rgba(255,255,255,.2);
  border-radius: 50px; padding: 10px 14px;
  font-family: 'Jost', 'Helvetica Neue', Arial, sans-serif; font-size: 18px;
  color: rgba(255,255,255,.8); cursor: pointer;
  transition: background .2s;
}
.btn-next:active { background: rgba(255,255,255,.2); }

/* ── PROGRESS BAR ── */
.day-progress { padding: 16px 20px 0; }
.progress-label {
  display: flex; justify-content: space-between;
  font-family: 'Jost', 'Helvetica Neue', Arial, sans-serif; font-size: 10px; font-weight: 300;
  color: var(--dust); letter-spacing: .08em; margin-bottom: 6px;
}
.progress-track {
  height: 3px; background: rgba(168,120,80,.15); border-radius: 2px; overflow: hidden;
}
.progress-fill {
  height: 100%; background: linear-gradient(to right, var(--terra), var(--gold));
  border-radius: 2px; transition: width .5s ease;
}

/* ── INTENTION BANNER ── */
.intention-banner {
  margin: 20px 20px 0;
  background: var(--cream);
  border-radius: 12px;
  padding: 16px 18px;
  border: 1px solid rgba(168,120,80,.15);
  display: flex; align-items: flex-start; gap: 12px;
}
.intention-icon { font-size: 20px; flex-shrink: 0; }
.intention-text {
  font-family: 'Cormorant Garamond', serif;
  font-size: 16px; font-style: italic; color: var(--stone);
  line-height: 1.65;
}
.intention-label {
  font-family: 'Jost', 'Helvetica Neue', Arial, sans-serif; font-size: 9px; font-weight: 400;
  letter-spacing: .18em; text-transform: uppercase; color: var(--terra);
  margin-bottom: 3px;
}

/* ── SECTION HEADERS ── */
.sched-section-header {
  padding: 24px 20px 8px;
  display: flex; align-items: center; gap: 10px;
}
.sched-section-name {
  font-family: 'Jost', 'Helvetica Neue', Arial, sans-serif; font-size: 9px; font-weight: 400;
  letter-spacing: .2em; text-transform: uppercase; color: var(--dust);
}
.sched-section-line {
  flex: 1; height: 1px; background: rgba(168,120,80,.15);
}

/* ── BLOCK CARDS ── */
.blocks-list { padding: 0 12px; }
.block-card {
  display: flex; gap: 0; margin-bottom: 6px;
  border-radius: 12px; overflow: hidden;
  background: var(--cream);
  border: 1px solid rgba(168,120,80,.1);
  cursor: pointer;
  transition: transform .15s, box-shadow .15s;
  position: relative;
}
.block-card:active { transform: scale(.98); }
.block-card.is-now {
  border-color: rgba(184,92,56,.35);
  box-shadow: 0 3px 14px rgba(184,92,56,.12);
}
.block-card.past { opacity: .5; }
.block-card.playing {
  border-color: var(--terra);
  box-shadow: 0 4px 18px rgba(184,92,56,.2);
}

.block-accent {
  width: 4px; flex-shrink: 0;
  background: rgba(168,120,80,.15);
}
.block-card.is-now .block-accent { background: var(--terra); }
.block-card.tag-run .block-accent { background: var(--sage); }
.block-card.tag-ritual .block-accent { background: var(--gold); }
.block-card.tag-matcha .block-accent { background: #6a8a48; }
.block-card.tag-focus .block-accent { background: #4a7a68; }
.block-card.tag-rest .block-accent { background: #9a7a88; }
.block-card.tag-sacred .block-accent { background: var(--terra); }

.block-inner {
  flex: 1; padding: 12px 14px 10px;
}
.block-top {
  display: flex; justify-content: space-between;
  align-items: flex-start; margin-bottom: 3px;
}
.block-time {
  font-family: 'Jost', 'Helvetica Neue', Arial, sans-serif; font-size: 10px; font-weight: 300;
  color: var(--dust); letter-spacing: .06em;
}
.block-pill {
  font-family: 'Jost', 'Helvetica Neue', Arial, sans-serif; font-size: 8px; font-weight: 400;
  letter-spacing: .1em; text-transform: uppercase;
  padding: 2px 7px; border-radius: 10px;
}
.pill-run    { background: rgba(90,120,72,.12); color: var(--sage); }
.pill-ritual { background: rgba(160,120,48,.1); color: var(--gold); }
.pill-matcha { background: rgba(90,130,60,.12); color: #5a8840; }
.pill-focus  { background: rgba(60,110,100,.1); color: #4a8878; }
.pill-rest   { background: rgba(140,100,120,.1); color: #8a6878; }
.pill-sacred { background: rgba(184,92,56,.1); color: var(--terra); }

.block-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 16px; font-weight: 400; color: var(--ink);
  line-height: 1.3; margin-bottom: 3px;
}
.block-note {
  font-family: 'Cormorant Garamond', serif;
  font-size: 13px; font-style: italic; color: var(--stone);
  line-height: 1.6; display: none;
}
.block-card.expanded .block-note { display: block; }
.block-play-btn {
  display: none; margin-top: 8px;
}
.block-card.expanded .block-play-btn { display: flex; }
.block-play-btn button {
  font-family: 'Jost', 'Helvetica Neue', Arial, sans-serif; font-size: 10px; font-weight: 400;
  letter-spacing: .1em; text-transform: uppercase;
  color: var(--terra); background: none; border: 1px solid rgba(184,92,56,.3);
  border-radius: 20px; padding: 5px 12px; cursor: pointer;
}
.block-play-btn button:active { background: rgba(184,92,56,.08); }

/* ── AUDIO WAVE INDICATOR ── */
.wave-indicator {
  display: none; align-items: center; gap: 2px; margin-left: 8px;
}
.block-card.playing .wave-indicator { display: flex; }
.wave-bar {
  width: 2px; background: var(--terra); border-radius: 1px;
  animation: wave 0.8s ease-in-out infinite;
}
.wave-bar:nth-child(1) { height: 6px; animation-delay: 0s; }
.wave-bar:nth-child(2) { height: 10px; animation-delay: 0.15s; }
.wave-bar:nth-child(3) { height: 7px; animation-delay: 0.3s; }
.wave-bar:nth-child(4) { height: 12px; animation-delay: 0.1s; }
@keyframes wave {
  0%,100% { transform: scaleY(1); }
  50% { transform: scaleY(0.4); }
}

/* ── DAY SELECTOR ── */
.day-selector {
  padding: 6px 20px 0;
  display: flex; gap: 6px; overflow-x: auto;
  scrollbar-width: none;
}
.day-selector::-webkit-scrollbar { display: none; }
.day-btn {
  flex-shrink: 0;
  font-family: 'Jost', 'Helvetica Neue', Arial, sans-serif; font-size: 10px; font-weight: 400;
  letter-spacing: .1em; text-transform: uppercase;
  padding: 7px 14px; border-radius: 20px;
  border: 1px solid rgba(168,120,80,.2);
  background: transparent; color: var(--dust); cursor: pointer;
  transition: all .18s;
}
.day-btn.active {
  background: var(--terra); border-color: var(--terra);
  color: #fff; box-shadow: 0 3px 10px rgba(184,92,56,.2);
}

/* ── AUDIO STATUS BAR ── */
.audio-bar {
  position: fixed; bottom: var(--safe-bot); left:0; right:0; z-index:200;
  padding: 12px 20px calc(var(--safe-bot) + 8px);
  background: rgba(245,237,224,.96);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-top: 1px solid rgba(168,120,80,.12);
  display: flex; align-items: center; gap: 12px;
  max-width: 100%;
}
.audio-bar.hidden { display: none; }
.audio-now-playing {
  flex: 1;
  font-family: 'Cormorant Garamond', serif;
  font-size: 14px; font-style: italic; color: var(--stone);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.audio-stop-btn {
  font-family: 'Jost', 'Helvetica Neue', Arial, sans-serif; font-size: 10px; font-weight: 400;
  letter-spacing: .1em; text-transform: uppercase;
  color: var(--terra); background: rgba(184,92,56,.08);
  border: 1px solid rgba(184,92,56,.2);
  border-radius: 20px; padding: 6px 14px; cursor: pointer;
  flex-shrink: 0;
}
.audio-mini-wave {
  display: flex; gap: 2px; align-items: center; flex-shrink: 0;
}
.audio-mini-wave .wave-bar { background: var(--terra); }

/* ── EIGHT HABITS TAB ── */
.habits-section { padding: 8px 12px 0; }
.habit-item {
  display: flex; gap: 14px; padding: 14px 14px;
  background: var(--cream); border-radius: 12px;
  border: 1px solid rgba(168,120,80,.1);
  margin-bottom: 6px; cursor: pointer;
  transition: transform .15s;
}
.habit-item:active { transform: scale(.98); }
.habit-num {
  font-family: 'Cormorant Garamond', serif; font-size: 28px;
  font-weight: 300; color: rgba(184,92,56,.2); line-height: 1;
  flex-shrink: 0; width: 32px;
}
.habit-content {}
.habit-title-sm {
  font-family: 'Cormorant Garamond', serif; font-size: 17px;
  font-weight: 400; color: var(--ink); margin-bottom: 2px;
}
.habit-tag-sm {
  font-family: 'Jost', 'Helvetica Neue', Arial, sans-serif; font-size: 9px; font-weight: 300;
  color: var(--dust); letter-spacing: .04em;
}
.habit-body-sm {
  display: none; margin-top: 10px; padding-top: 10px;
  border-top: 1px solid rgba(168,120,80,.1);
}
.habit-item.open .habit-body-sm { display: block; }
.habit-body-text {
  font-family: 'Cormorant Garamond', serif; font-size: 15px;
  color: var(--stone); line-height: 1.75; margin-bottom: 8px;
}
.habit-body-practice {
  font-family: 'Cormorant Garamond', serif; font-size: 14px;
  font-style: italic; color: var(--terra); line-height: 1.7;
  padding: 8px 12px; background: rgba(184,92,56,.06);
  border-radius: 8px; border-left: 2px solid var(--terra);
}
.habit-speak-btn {
  margin-top: 10px;
  font-family: 'Jost', 'Helvetica Neue', Arial, sans-serif; font-size: 10px; font-weight: 400;
  letter-spacing: .1em; text-transform: uppercase;
  color: var(--terra); background: none;
  border: 1px solid rgba(184,92,56,.25); border-radius: 20px;
  padding: 6px 14px; cursor: pointer;
}

/* ── TAB BAR ── */
.tab-bar {
  position: fixed; bottom:0; left:0; right:0; z-index:100;
  background: rgba(245,237,224,.97);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-top: 1px solid rgba(168,120,80,.15);
  display: flex;
  padding-bottom: var(--safe-bot);
}
.tab-item {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; padding: 10px 4px 6px;
  cursor: pointer; transition: opacity .15s;
  border: none; background: none;
}
.tab-item:active { opacity: .6; }
.tab-icon { font-size: 20px; margin-bottom: 2px; }
.tab-label {
  font-family: 'Jost', 'Helvetica Neue', Arial, sans-serif; font-size: 9px; font-weight: 400;
  letter-spacing: .08em; text-transform: uppercase; color: var(--dust);
}
.tab-item.active .tab-label { color: var(--terra); }
.tab-item.active .tab-icon { filter: none; }

/* ── VIEWS ── */
.view { display: none; }
.view.active { display: block; }

/* ── QUOTE CARD ── */
.quote-card {
  margin: 16px 12px 0;
  background: linear-gradient(135deg, rgba(184,92,56,.08), rgba(160,120,48,.06));
  border-radius: 12px; padding: 18px 18px;
  border: 1px solid rgba(168,120,80,.15);
}
.quote-text {
  font-family: 'Cormorant Garamond', serif; font-size: 16px;
  font-style: italic; color: var(--stone); line-height: 1.75;
  margin-bottom: 6px;
}
.quote-source {
  font-family: 'Jost', 'Helvetica Neue', Arial, sans-serif; font-size: 9px; font-weight: 300;
  color: var(--dust); letter-spacing: .1em; text-transform: uppercase;
}
.quote-speak {
  margin-top: 12px;
  font-family: 'Jost', 'Helvetica Neue', Arial, sans-serif; font-size: 10px; font-weight: 400;
  letter-spacing: .1em; text-transform: uppercase;
  color: var(--terra); background: none;
  border: 1px solid rgba(184,92,56,.25); border-radius: 20px;
  padding: 6px 14px; cursor: pointer; display: block;
}

/* ── CHECKBOX ── */
.block-check {
  width: 22px; height: 22px; border-radius: 50%;
  border: 1.5px solid rgba(168,120,80,.3);
  flex-shrink: 0; display: flex; align-items: center; justify-content: center;
  margin: auto 8px auto 10px; cursor: pointer;
  transition: all .2s; background: transparent; align-self: center;
}
.block-check.checked { background: var(--sage); border-color: var(--sage); }
.block-check.checked::after { content: '✓'; color: #fff; font-size: 12px; }
.block-card.done .block-title { text-decoration: line-through; opacity: .7; }
.block-card.done { opacity: .55; }

/* ── MONEY CARDS ── */
.money-card {
  margin: 0 12px 10px; background: var(--cream); border-radius: 14px;
  border: 1px solid rgba(168,120,80,.12); border-left: 4px solid var(--gold);
  padding: 18px; cursor: pointer; transition: transform .15s;
}
.money-card:active { transform: scale(.98); }
.money-card-label {
  font-family: Jost,sans-serif; font-size: 9px; font-weight: 400;
  letter-spacing: .2em; text-transform: uppercase; color: var(--gold); margin-bottom: 5px;
}
.money-card-title {
  font-family: Cormorant Garamond,serif; font-size: 18px;
  font-weight: 400; color: var(--ink); margin-bottom: 6px;
}
.money-card-text {
  font-family: Cormorant Garamond,serif; font-size: 15px;
  color: var(--stone); line-height: 1.75; font-style: italic; margin-bottom: 8px;
}
.money-card-action {
  font-family: Jost,sans-serif; font-size: 10px; font-weight: 300;
  color: var(--terra); letter-spacing: .04em; line-height: 1.6;
}

/* ── DINNER ── */
.dinner-hero {
  margin: 16px 12px 12px; background: var(--terra);
  border-radius: 16px; padding: 22px 20px;
  position: relative; overflow: hidden;
}
.dinner-hero::before {
  content:''; position:absolute; top:-20px; right:-20px;
  width:100px; height:100px; border-radius:50%; background:rgba(255,255,255,.08);
}
.dinner-hero-label {
  font-family: Jost,sans-serif; font-size: 10px; font-weight: 300;
  letter-spacing: .16em; text-transform: uppercase; color: rgba(255,255,255,.7); margin-bottom: 6px;
}
.dinner-hero-title {
  font-family: Cormorant Garamond,serif; font-size: 26px;
  font-weight: 400; color: #fff; line-height: 1.2; margin-bottom: 8px;
}
.dinner-hero-note {
  font-family: Cormorant Garamond,serif; font-size: 15px;
  font-style: italic; color: rgba(255,255,255,.82); line-height: 1.6; margin-bottom: 16px;
}
.dinner-tags { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px; }
.dinner-tag {
  font-family: Jost,sans-serif; font-size: 9px; font-weight: 400;
  letter-spacing: .1em; text-transform: uppercase;
  padding: 3px 10px; border-radius: 20px;
  background: rgba(255,255,255,.18); color: rgba(255,255,255,.9);
}
.dinner-btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  background: rgba(255,255,255,.2); border: 1px solid rgba(255,255,255,.35);
  border-radius: 50px; padding: 11px 20px; width: 100%;
  font-family: Jost,sans-serif; font-size: 12px; font-weight: 400;
  letter-spacing: .08em; color: #fff; cursor: pointer; transition: background .2s;
}
.dinner-btn:active { background: rgba(255,255,255,.3); }
.dinner-card {
  margin: 0 12px 10px; background: var(--cream);
  border-radius: 14px; border: 1px solid rgba(168,120,80,.12); padding: 18px;
}
.dinner-card-cuisine {
  font-family: Jost,sans-serif; font-size: 9px; font-weight: 400;
  letter-spacing: .18em; text-transform: uppercase; color: var(--terra); margin-bottom: 5px;
}
.dinner-card-name {
  font-family: Cormorant Garamond,serif; font-size: 22px;
  font-weight: 400; color: var(--ink); margin-bottom: 6px;
}
.dinner-card-desc {
  font-family: Cormorant Garamond,serif; font-size: 15px;
  color: var(--stone); line-height: 1.75; font-style: italic; margin-bottom: 12px;
}
.dinner-card-steps {
  font-family: Cormorant Garamond,serif; font-size: 15px;
  color: var(--ink); line-height: 1.8;
}
.dinner-card-ingredients {
  font-family: Jost,sans-serif; font-size: 11px; font-weight: 300;
  color: var(--dust); letter-spacing: .03em; line-height: 1.8; margin-bottom: 10px;
}


/* ── HUNDRED ACRE WOOD BACKGROUND ── */
.wood-bg {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  overflow: hidden;
}
.wood-bg svg { width: 100%; height: 100%; }

/* ── FLOATING CHARACTERS ── */
.pooh-character {
  display: flex; justify-content: center; padding: 8px 0 4px;
  pointer-events: none; opacity: 0.55;
}
.pooh-divider {
  display: flex; align-items: center; gap: 10px;
  padding: 6px 20px; opacity: 0.45;
}
.pooh-divider-line {
  flex: 1; height: 1px; background: rgba(168,120,80,.2);
}
.pooh-divider-text {
  font-family: Cormorant Garamond, serif; font-size: 12px;
  font-style: italic; color: var(--dust); letter-spacing: .06em;
}

/* ── HONEY POT LOADER ── */
.honey-loading {
  display: flex; flex-direction: column; align-items: center;
  padding: 32px 0; opacity: 0.6;
}
.honey-loading-text {
  font-family: Cormorant Garamond, serif; font-size: 14px;
  font-style: italic; color: var(--stone); margin-top: 8px;
}

/* Ensure main content is above background */
.main, .app-header, .tab-bar, .audio-bar, #apiOverlay {
  position: relative; z-index: 1;
}
.app-header, .tab-bar, .audio-bar { z-index: 100; }
#apiOverlay { z-index: 999; }


/* ── TAB BACKGROUNDS ── */
.tab-bg {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  display: none; overflow: hidden;
  background: #f5ede0;
  content-visibility: auto;
}
.tab-bg.active { display: block; }
.main { position: relative; z-index: 1; }


.audio-ctrl-btn {
  font-family: Jost,sans-serif; font-size: 13px; font-weight: 400;
  color: var(--terra); background: rgba(184,92,56,.08);
  border: 1px solid rgba(184,92,56,.2); border-radius: 20px;
  padding: 5px 12px; cursor: pointer; flex-shrink: 0;
  transition: background .15s;
}
.audio-ctrl-btn:active { background: rgba(184,92,56,.18); }


/* ── LOFI MUSIC ── */
.music-wave { display:inline-flex; gap:2px; align-items:center; }
.music-wave span {
  width:2px; background:var(--sage); border-radius:1px;
  animation: mwave 0.7s ease-in-out infinite;
}
.music-wave span:nth-child(1) { height:5px; animation-delay:0s; }
.music-wave span:nth-child(2) { height:9px; animation-delay:0.15s; }
.music-wave span:nth-child(3) { height:6px; animation-delay:0.3s; }
@keyframes mwave {
  0%,100% { transform:scaleY(1); }
  50% { transform:scaleY(0.35); }
}

</style>
</head>

function nowMinutes() {
  const d = new Date();
  return d.getHours() * 60 + d.getMinutes();
}

function findCurrentBlock(dayIdx) {
  const blocks = SCHEDULE[dayIdx] || [];
  const now = nowMinutes();
  let current = null;
  for (let i = 0; i < blocks.length; i++) {
    if (blocks[i].m <= now) current = i;
    else break;
  }
  return current;
}

function formatTime() {
  const d = new Date();
  const h = d.getHours(), m = d.getMinutes();
  const ampm = h >= 12 ? 'pm' : 'am';
  const h12 = h % 12 || 12;
  return `${h12}:${String(m).padStart(2,'0')} ${ampm}`;
}

function dayProgress(dayIdx) {
  const blocks = SCHEDULE[dayIdx] || [];
  if (!blocks.length) return 0;
  const now = nowMinutes();
  const first = blocks[0].m;
  const last = blocks[blocks.length-1].m + 30;
  return Math.min(100, Math.max(0, ((now - first) / (last - first)) * 100));
}

// ── RENDER TODAY TAB ─────────────────────────────────────────────────
function renderToday() {
  const blocks = SCHEDULE[viewDay] || [];
  const now = nowMinutes();
  const currentIdx = findCurrentBlock(viewDay);
  const progress = dayProgress(viewDay);
  const today = new Date();
  const isToday = viewDay === (today.getDay() === 0 ? 6 : today.getDay() - 1);
  const currentBlock = currentIdx !== null ? blocks[currentIdx] : null;
  const nextBlock = currentIdx !== null && currentIdx + 1 < blocks.length ? blocks[currentIdx + 1] : null;

  const intentionText = INTENTIONS[viewDay];

  let html = `
    <div class="now-section">
      <div class="now-label">${isToday ? 'Right Now' : DAY_NAMES[viewDay]}</div>
  `;

  if (currentBlock && isToday) {
    html += `
      <div class="now-card">
        <div class="now-time-badge">${currentBlock.t} · ${DAY_NAMES[viewDay]}</div>
        <div class="now-title">${currentBlock.title}</div>
        ${currentBlock.note ? `<div class="now-note">${currentBlock.note}</div>` : ''}
        ${currentBlock.tag ? `<div class="now-tag">${currentBlock.tag}</div>` : ''}
        <div class="now-actions">
          <button class="btn-play" style="display:none">
            ▶ Play guide
          </button>
          ${nextBlock ? `<button class="btn-next" onclick="scrollToNext()" title="Next">›</button>` : ''}
        </div>
      </div>
    `;
  } else {
    html += `
      <div class="now-card" style="background:var(--sage)">
        <div class="now-time-badge">${DAY_NAMES[viewDay]}</div>
        <div class="now-title">View the full schedule below</div>
        <div class="now-note">Tap any block to expand it and hear it read aloud.</div>
        <div class="now-actions">
          <button class="btn-play" onclick="void(0)" style="display:none" style="background:rgba(255,255,255,.18)">
            <span class="play-icon">▶</span> Morning guide
          </button>
        </div>
      </div>
    `;
  }

  html += `</div>`;

  if (isToday) {
    html += `
      <div class="day-progress">
        <div class="progress-label">
          <span>Day progress</span>
          <span>${Math.round(progress)}%</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" style="width:${progress}%"></div>
        </div>
      </div>
    `;
  }

  // Day selector
  html += `<div class="day-selector">`;
  DAY_NAMES.forEach((name, i) => {
    html += `<button class="day-btn ${i===viewDay?'active':''}" onclick="changeDay(${i})">${name.slice(0,3)}</button>`;
  });
  html += `</div>`;

  // Intention
  html += `
    <div class="intention-banner">
      <div class="intention-icon">✦</div>
      <div>
        <div class="intention-label">Today's intention</div>
        <div class="intention-text">${intentionText}</div>
      </div>
    </div>
  `;

  // Blocks grouped
  const sections = ['Morning','Work','Afternoon','Evening'];
  const sectionRanges = [[0,720],[720,960],[960,1080],[1080,1440]];

  sectionRanges.forEach(([start, end], si) => {
    const sectionBlocks = blocks.filter(b => b.m >= start && b.m < end);
    if (!sectionBlocks.length) return;

    html += `
      <div class="sched-section-header">
        <span class="sched-section-name">${sections[si]}</span>
        <div class="sched-section-line"></div>
      </div>
      <div class="blocks-list">
    `;

    sectionBlocks.forEach((block, bi) => {
      const globalIdx = blocks.indexOf(block);
      const isPast = isToday && block.m < now - 15;
      const isNow = isToday && globalIdx === currentIdx;
      const tagClass = block.tag ? `tag-${block.tag}` : '';
      const pillClass = block.tag ? `pill-${block.tag}` : '';
      const blockDone = isDone(viewDay, globalIdx);
      html += `
        <div class="block-card ${tagClass} ${isPast?'past':''} ${isNow?'is-now':''} ${blockDone?'done':''}"
             id="block-${viewDay}-${globalIdx}"
             onclick="toggleBlock(this, ${viewDay}, ${globalIdx})">
          <div class="block-accent"></div>
          <div class="block-check ${blockDone?'checked':''}"
               onclick="toggleDone(${viewDay}, ${globalIdx}, event)"></div>
          <div class="block-inner">
            <div class="block-top">
              <div class="block-time">${block.t}</div>
              <div style="display:flex;align-items:center;gap:6px">
                <div class="wave-indicator">
                  <div class="wave-bar"></div><div class="wave-bar"></div>
                  <div class="wave-bar"></div><div class="wave-bar"></div>
                </div>
                ${block.tag ? `<span class="block-pill ${pillClass}">${block.tag}</span>` : ''}
              </div>
            </div>
            <div class="block-title">${block.title}</div>
            <div class="block-note">${block.note || ''}</div>

          </div>
        </div>
      `;
    });

    html += `</div>`;
  });

  document.getElementById('mainContent').innerHTML = html;

  // Store current block ref for now-card speak
  window._currentBlock = currentBlock;

  // Add Pooh between now card and schedule
  html += poohSectionDivider('the hundred acre wood', 'pooh');
}

async function generateMeal(type) {
  var btn = document.getElementById('mealBtn-' + type);
  var container = document.getElementById('mealResult-' + type);
  if (btn) { btn.textContent = 'Finding...'; btn.style.opacity = '.7'; }
  if (container) container.innerHTML = '<div style="padding:20px;text-align:center;font-style:italic;color:var(--stone);font-size:15px">Thinking... (~10 seconds)</div>';

  try {
    var response = await fetch(ANTHROPIC_PROXY, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-5',
        max_tokens: 600,
        messages: [{ role: 'user', content: MEAL_PROMPTS[type]() }]
      })
    });
    var data = await response.json();
    if (!response.ok || !data.content) {
      throw new Error((data.error && data.error.message) || 'API error ' + response.status);
    }
    var text = data.content[0].text.replace(/```json|```/g, '').trim();
    var meal = JSON.parse(text);
    currentMeals[type] = meal;

    mealHistory[type].push(meal.name);
    if (mealHistory[type].length > 15) mealHistory[type] = mealHistory[type].slice(-15);
    try { localStorage.setItem('bloom_meals', JSON.stringify(mealHistory)); } catch(e) {}

    var sfSpot = meal.sf_spot ? '<div style="margin-top:8px;font-size:11px;letter-spacing:.06em;color:var(--sage)">✦ Try in SF: ' + meal.sf_spot + '</div>' : '';
    var difficultyLine = meal.difficulty ? '<div class="dinner-card-time-item"><span>' + meal.difficulty + '</span>Difficulty</div>' : '';

    if (container) container.innerHTML =
      '<div class="dinner-card">' +
        '<div class="dinner-card-cuisine">' + meal.cuisine + '</div>' +
        '<div class="dinner-card-name">' + meal.name + '</div>' +
        '<div class="dinner-card-desc">' + (meal.description || '') + '</div>' +
        '<div class="dinner-card-ingredients">' + meal.ingredients.join(' · ') + '</div>' +
        '<div class="dinner-card-steps">' + meal.method + '</div>' +
        '<div style="margin-top:10px;font-size:14px;font-style:italic;color:var(--terra)">' + (meal.why || meal.why_tonight || '') + '</div>' +
        sfSpot +
        '<div style="display:flex;gap:12px;margin-top:10px;padding-top:10px;border-top:1px solid rgba(168,120,80,.1)">' +
          '<div class="dinner-card-time-item"><span>' + meal.time + '</span>Time</div>' +
          difficultyLine +
        '</div>' +
        '<div style="text-align:center;padding:10px 0 0;cursor:pointer;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--dust)" onclick="generateMeal(&quot;' + type + '&quot;)">Try another →</div>' +
      '</div>';
  } catch(e) {
    var msg = (e && e.message) ? e.message : 'Unknown error';
    if (container) container.innerHTML = '<div style="padding:16px;font-size:13px;color:var(--stone);text-align:center">' +
      '<div style="margin-bottom:6px">⚠ ' + msg.slice(0, 150) + '</div>' +
      '<div style="font-size:11px;opacity:.6">Tap to retry</div>' +
      '</div>';
    if (container) container.onclick = function() { container.onclick=null; generateMeal(type); };
  }
  if (btn) { btn.textContent = '↺ New suggestion'; btn.style.opacity = '1'; }
}

var sfCache = null;
var sfCacheTime = 0;

async function loadSFContent() {
  var container = document.getElementById('sfContent');
  if (!container) return;

  // Use cache if < 3 hours old
  if (sfCache && (Date.now() - sfCacheTime) < 10800000) {
    container.innerHTML = sfCache; return;
  }

  container.innerHTML = '<div style="padding:20px;text-align:center;font-style:italic;color:var(--stone)">Checking what&#39;s on in SF...</div>';

  var today = new Date();
  var month = today.toLocaleString('en-US', { month: 'long' });
  var dayOfWeek = today.toLocaleString('en-US', { weekday: 'long' });

  try {
    var response = await fetch(ANTHROPIC_PROXY, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-5',
        max_tokens: 800,
        tools: [{ type: 'web_search_20250305', name: 'web_search' }],
        messages: [{
          role: 'user',
          content: 'It is ' + dayOfWeek + ' in ' + month + ' 2026 in San Francisco. Search for: (1) what is currently at SFMOMA or de Young museum this week, (2) what produce is in season at SF farmers markets right now, (3) one food/restaurant event or popup happening in SF this week. Return as JSON only, no markdown: {"museums":[{"name":"venue name","exhibition":"current show name","note":"one short interesting note"}],"seasonal_produce":["item1","item2","item3","item4"],"event":{"name":"event name","where":"location","note":"one sentence"}}'
        }]
      })
    });
    var data = await response.json();
    var textBlock = data.content.filter(function(b) { return b.type === 'text'; })[0];
    if (!textBlock) throw new Error('no text');
    var text = textBlock.text.replace(/```json|```/g, '').trim();
    var sf = JSON.parse(text);

    var html = '';

    if (sf.museums && sf.museums.length) {
      sf.museums.forEach(function(m) {
        html += '<div class="money-card" style="border-left-color:var(--sage)">' +
          '<div class="money-card-label">' + m.name + '</div>' +
          '<div class="money-card-title">' + m.exhibition + '</div>' +
          '<div class="money-card-text">' + (m.note || '') + '</div>' +
        '</div>';
      });
    }

    if (sf.seasonal_produce && sf.seasonal_produce.length) {
      html += '<div class="money-card" style="border-left-color:var(--terra)">' +
        '<div class="money-card-label">Warm Water Cove · Farmers Market</div>' +
        '<div class="money-card-title">In season now</div>' +
        '<div class="money-card-text" style="display:block">' + sf.seasonal_produce.join('  ·  ') + '</div>' +
      '</div>';
    }

    if (sf.event) {
      html += '<div class="money-card" style="border-left-color:var(--gold)">' +
        '<div class="money-card-label">This week</div>' +
        '<div class="money-card-title">' + sf.event.name + '</div>' +
        '<div class="money-card-text">' + sf.event.where + '</div>' +
        '<div class="money-card-action">' + (sf.event.note || '') + '</div>' +
      '</div>';
    }

    sfCache = html;
    sfCacheTime = Date.now();
    container.innerHTML = html || '<div style="padding:16px;font-style:italic;color:var(--stone)">No events found right now.</div>';

  } catch(e) {
    var msg = (e && e.message) ? e.message : 'Unknown error';
    if (container) container.innerHTML = '<div style="padding:16px;font-size:13px;color:var(--stone)">' + msg.slice(0,150) + '</div>';
  }
}

// ── RENDER FOOD TAB ───────────────────────────────────────────────────
function renderDinner() {
  var hour = new Date().getHours();
  var meals = [
    { type: 'breakfast', icon: '☀️', label: 'Breakfast', sub: 'Morning · 15–25 min', color: 'var(--gold)' },
    { type: 'lunch',     icon: '🍱', label: 'Lunch',     sub: 'Midday · 20–30 min',  color: 'var(--sage)' },
    { type: 'dinner',    icon: '🌙', label: 'Dinner',    sub: 'Evening · 30–60 min', color: 'var(--terra)' }
  ];

  var html = '<div style="padding:16px 20px 4px">' +
    '<p style="font-family:Cormorant Garamond,serif;font-size:18px;font-style:italic;color:var(--stone);line-height:1.75;margin-bottom:4px">What should she eat?</p>' +
    '<p style="font-family:Jost,sans-serif;font-size:11px;font-weight:300;color:var(--dust);letter-spacing:.04em;margin-bottom:12px">Matched to her palate. Tap any meal to get a suggestion.</p>' +
  '</div>';

  meals.forEach(function(m) {
    html +=
      '<div style="margin:0 12px 4px;background:var(--cream);border-radius:14px;border:1px solid rgba(168,120,80,.12);border-left:4px solid ' + m.color + ';padding:14px 16px">' +
        '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">' +
          '<div>' +
            '<div style="font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--dust);margin-bottom:3px">' + m.sub + '</div>' +
            '<div style="font-family:Cormorant Garamond,serif;font-size:20px;color:var(--ink)">' + m.icon + '  ' + m.label + '</div>' +
          '</div>' +
          '<button id="mealBtn-' + m.type + '" onclick="generateMeal(&quot;' + m.type + '&quot;)" ' +
            'style="font-family:Jost,sans-serif;font-size:10px;font-weight:400;letter-spacing:.08em;text-transform:uppercase;' +
            'color:#fff;background:' + m.color + ';border:none;border-radius:20px;padding:7px 14px;cursor:pointer">' +
            '✦ Suggest' +
          '</button>' +
        '</div>' +
        '<div id="mealResult-' + m.type + '"></div>' +
      '</div>';
  });

  // SF live section - built via DOM to avoid quote issues
  document.getElementById('mainContent').innerHTML = html;
  var sfWrap = document.createElement('div');
  sfWrap.style.margin = '12px 12px 0';
  sfWrap.innerHTML = [
    '<div style="font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--dust);margin-bottom:8px">What\'s on in SF</div>',
    '<div id="sfContent"></div>',
    '<div style="text-align:center;padding:8px 0;cursor:pointer;font-size:10px;letter-spacing:.06em;color:var(--dust)" onclick="loadSFContent()">&#8635; Refresh</div>'
  ].join('');
  document.getElementById('mainContent').appendChild(sfWrap);

  // Auto-suggest dinner when tab opens (lazy - only first time)
  if (!window._dinnerHasLoaded) {
    window._dinnerHasLoaded = true;
    setTimeout(function() { generateMeal('dinner'); }, 50);
    setTimeout(function() { loadSFContent(); }, 100);
  }
}

function toggleGuide(el) {
  var panel = el.nextElementSibling;
  panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
}

function renderVoice() {
  var hour = new Date().getHours();
  var defaultKey = 'morning';
  if (hour >= 12 && hour < 17) defaultKey = 'midday';
  else if (hour >= 17) defaultKey = 'evening';
  if (new Date().getDay() === 0) defaultKey = 'sunday';

  var guides = [
    { key:'morning', icon:'🌅', title:'Morning Guide',     desc:'The first two hours. Matcha, deep work, direction.' },
    { key:'midday',  icon:'☀',  title:'Midday Check-In',  desc:'The afternoon reset. Lunch outside, lighter work.' },
    { key:'evening', icon:'🌙', title:'Evening Wind-Down', desc:'The formal close. Walk, transition into rest.' },
    { key:'sunday',  icon:'🕯', title:'Sunday Guide',      desc:'The protected afternoon. Offline, honest, present.' }
  ];

  var html = '<div style="padding:16px 20px 4px">' +
    '<p style="font-family:Cormorant Garamond,serif;font-size:18px;font-style:italic;color:var(--stone);line-height:1.75;margin-bottom:4px">Read a guide for the time of day.</p>' +
    '<p style="font-family:Jost,sans-serif;font-size:11px;font-weight:300;color:var(--dust);letter-spacing:.04em;margin-bottom:16px">Tap a card to expand the script.</p>' +
  '</div>';

  guides.forEach(function(g) {
    var isRec = g.key === defaultKey;
    var script = (GUIDE_SCRIPTS[g.key] || '').replace(/</g,'&lt;');
    var bg  = isRec ? 'var(--terra)' : 'var(--cream)';
    var bdr = isRec ? 'transparent' : 'rgba(168,120,80,.15)';
    var clr = isRec ? '#fff' : 'var(--ink)';
    var sub = isRec ? 'rgba(255,255,255,.75)' : 'var(--stone)';
    var scriptClr = isRec ? 'rgba(255,255,255,.9)' : 'var(--stone)';
    var divBdr = isRec ? 'rgba(255,255,255,.15)' : 'rgba(168,120,80,.1)';
    var nowBadge = isRec ? '<div style="font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.8);background:rgba(255,255,255,.15);border-radius:10px;padding:3px 8px">Now</div>' : '';
    html +=
      '<div style="margin:0 12px 10px;background:' + bg + ';border-radius:14px;border:1px solid ' + bdr + ';overflow:hidden">' +
        '<div onclick="toggleGuide(this)" style="display:flex;align-items:center;gap:14px;padding:18px 20px;cursor:pointer">' +
          '<div style="font-size:26px">' + g.icon + '</div>' +
          '<div style="flex:1">' +
            '<div style="font-family:Cormorant Garamond,serif;font-size:19px;color:' + clr + '">' + g.title + '</div>' +
            '<div style="font-size:12px;color:' + sub + ';margin-top:3px">' + g.desc + '</div>' +
          '</div>' + nowBadge +
        '</div>' +
        '<div style="display:none;padding:0 20px 18px;border-top:1px solid ' + divBdr + '">' +
          '<p style="font-family:Cormorant Garamond,serif;font-size:16px;line-height:1.9;color:' + scriptClr + ';margin:12px 0 0;white-space:pre-line">' + script + '</p>' +
        '</div>' +
      '</div>';
  });

  document.getElementById('mainContent').innerHTML = html;
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
  var tabEl = document.getElementById('tab-' + tab);
  if (tabEl) tabEl.classList.add('active');
  // Swap background
  document.querySelectorAll('.tab-bg').forEach(b => b.classList.remove('active'));
  var bg = document.getElementById('tabBg-' + tab);
  if (bg) bg.classList.add('active');
  // Render content
  if (tab === 'today') renderToday();
  else if (tab === 'habits') renderHabits();
  else if (tab === 'money') renderMoney();
  else if (tab === 'dinner') renderDinner();
  else if (tab === 'voice') renderVoice();
}

// ── CLOCK ─────────────────────────────────────────────────────────────
function updateClock() {
  document.getElementById('liveTime').textContent = formatTime();
}
setInterval(updateClock, 30000);
updateClock();

// ── AUTO-REFRESH CURRENT BLOCK ────────────────────────────────────────
setInterval(() => {
  if (currentTab === 'today') {
    const isToday = viewDay === (new Date().getDay() === 0 ? 6 : new Date().getDay() - 1);
    if (isToday) renderToday();
  }
}, 60000);

// ── INIT ──────────────────────────────────────────────────────────────
// ResponsiveVoice handles voice loading automatically

renderToday();

// ── SERVICE WORKER (PWA cache for instant repeat loads) ───────────────
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('./blossom-sw.js').catch(function(e) {
      console.log('SW registration skipped:', e.message);
    });
  });
}
</script>
