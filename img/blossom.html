<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="In Full Bloom">
<link rel="manifest" href="./blossom-manifest.json">
<link rel="apple-touch-icon" href="./blossom-icon.svg">
<title>Blossom</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@200;300;400&display=swap" rel="stylesheet">
<style>
:root {
  --bg:     #f5ede0;
  --bg2:    #ede0cc;
  --terra:  #b85c38;
  --terra-l:#d4835a;
  --gold:   #a07830;
  --sage:   #5a7848;
  --sage-l: #7a9868;
  --cream:  #faf6ee;
  --ink:    #2a1e14;
  --stone:  #6a5a48;
  --dust:   #9a8878;
  --petal:  #e8c0a8;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bot: env(safe-area-inset-bottom, 0px);
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

body {
  background: var(--bg);
  color: var(--ink);
  font-family: 'Jost', sans-serif;
  font-weight: 300;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── HEADER ── */
.app-header {
  position: fixed; top: calc(var(--safe-top) + 42px); left:0; right:0; z-index:100;
  padding: 14px 22px 12px;
  background: rgba(245,237,224,.94);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid rgba(168,120,80,.12);
}
.header-inner {
  display: flex; align-items: center; justify-content: space-between;
  max-width: 480px; margin: 0 auto;
}
.app-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 17px; font-weight: 400; font-style: italic;
  color: var(--terra); letter-spacing: .02em;
}
.live-time {
  font-family: 'Jost', sans-serif; font-size: 13px; font-weight: 300;
  color: var(--stone); letter-spacing: .06em;
}

/* ── MAIN ── */
.main {
  padding-top: calc(var(--safe-top) + 112px);
  padding-bottom: calc(var(--safe-bot) + 24px);
  max-width: 480px; margin: 0 auto;
}

/* ── NOW CARD ── */
.now-section { padding: 24px 20px 0; }
.now-label {
  font-family: 'Jost', sans-serif; font-size: 9px; font-weight: 400;
  letter-spacing: .22em; text-transform: uppercase; color: var(--terra);
  margin-bottom: 10px;
}
.now-card {
  background: var(--terra);
  border-radius: 16px;
  padding: 24px 24px 20px;
  position: relative; overflow: hidden;
  box-shadow: 0 8px 32px rgba(184,92,56,.22);
}
.now-card::before {
  content: '';
  position: absolute; top:-30px; right:-30px;
  width: 140px; height: 140px; border-radius: 50%;
  background: rgba(255,255,255,.08);
}
.now-card::after {
  content: '';
  position: absolute; bottom:-20px; left:20px;
  width: 80px; height: 80px; border-radius: 50%;
  background: rgba(255,255,255,.05);
}
.now-time-badge {
  display: inline-block;
  font-family: 'Jost', sans-serif; font-size: 11px; font-weight: 300;
  letter-spacing: .12em; text-transform: uppercase;
  color: rgba(255,255,255,.7); margin-bottom: 10px;
}
.now-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 26px; font-weight: 400; color: #fff;
  line-height: 1.2; margin-bottom: 8px;
}
.now-note {
  font-family: 'Cormorant Garamond', serif;
  font-size: 15px; font-style: italic;
  color: rgba(255,255,255,.8); line-height: 1.65;
  margin-bottom: 18px;
}
.now-tag {
  display: inline-block;
  font-family: 'Jost', sans-serif; font-size: 9px; font-weight: 400;
  letter-spacing: .12em; text-transform: uppercase;
  padding: 3px 10px; border-radius: 20px;
  background: rgba(255,255,255,.18); color: rgba(255,255,255,.9);
  margin-bottom: 18px;
}
.now-actions {
  display: flex; gap: 10px; align-items: center;
}
.btn-play {
  display: flex; align-items: center; gap: 8px;
  background: rgba(255,255,255,.18);
  border: 1px solid rgba(255,255,255,.3);
  border-radius: 50px; padding: 10px 20px;
  font-family: 'Jost', sans-serif; font-size: 12px; font-weight: 400;
  letter-spacing: .08em; color: #fff; cursor: pointer;
  transition: background .2s;
  flex: 1; justify-content: center;
}
.btn-play:active { background: rgba(255,255,255,.28); }
.btn-play .play-icon { font-size: 14px; }
.btn-next {
  display: flex; align-items: center;
  background: rgba(255,255,255,.1);
  border: 1px solid rgba(255,255,255,.2);
  border-radius: 50px; padding: 10px 14px;
  font-family: 'Jost', sans-serif; font-size: 18px;
  color: rgba(255,255,255,.8); cursor: pointer;
  transition: background .2s;
}
.btn-next:active { background: rgba(255,255,255,.2); }

/* ── PROGRESS BAR ── */
.day-progress { padding: 16px 20px 0; }
.progress-label {
  display: flex; justify-content: space-between;
  font-family: 'Jost', sans-serif; font-size: 10px; font-weight: 300;
  color: var(--dust); letter-spacing: .08em; margin-bottom: 6px;
}
.progress-track {
  height: 3px; background: rgba(168,120,80,.15); border-radius: 2px; overflow: hidden;
}
.progress-fill {
  height: 100%; background: linear-gradient(to right, var(--terra), var(--gold));
  border-radius: 2px; transition: width .5s ease;
}

/* ── INTENTION BANNER ── */
.intention-banner {
  margin: 20px 20px 0;
  background: var(--cream);
  border-radius: 12px;
  padding: 16px 18px;
  border: 1px solid rgba(168,120,80,.15);
  display: flex; align-items: flex-start; gap: 12px;
}
.intention-icon { font-size: 20px; flex-shrink: 0; }
.intention-text {
  font-family: 'Cormorant Garamond', serif;
  font-size: 16px; font-style: italic; color: var(--stone);
  line-height: 1.65;
}
.intention-label {
  font-family: 'Jost', sans-serif; font-size: 9px; font-weight: 400;
  letter-spacing: .18em; text-transform: uppercase; color: var(--terra);
  margin-bottom: 3px;
}

/* ── SECTION HEADERS ── */
.sched-section-header {
  padding: 24px 20px 8px;
  display: flex; align-items: center; gap: 10px;
}
.sched-section-name {
  font-family: 'Jost', sans-serif; font-size: 9px; font-weight: 400;
  letter-spacing: .2em; text-transform: uppercase; color: var(--dust);
}
.sched-section-line {
  flex: 1; height: 1px; background: rgba(168,120,80,.15);
}

/* ── BLOCK CARDS ── */
.blocks-list { padding: 0 12px; }
.block-card {
  display: flex; gap: 0; margin-bottom: 6px;
  border-radius: 12px; overflow: hidden;
  background: var(--cream);
  border: 1px solid rgba(168,120,80,.1);
  cursor: pointer;
  transition: transform .15s, box-shadow .15s;
  position: relative;
}
.block-card:active { transform: scale(.98); }
.block-card.is-now {
  border-color: rgba(184,92,56,.35);
  box-shadow: 0 3px 14px rgba(184,92,56,.12);
}
.block-card.past { opacity: .5; }
.block-card.playing {
  border-color: var(--terra);
  box-shadow: 0 4px 18px rgba(184,92,56,.2);
}

.block-accent {
  width: 4px; flex-shrink: 0;
  background: rgba(168,120,80,.15);
}
.block-card.is-now .block-accent { background: var(--terra); }
.block-card.tag-run .block-accent { background: var(--sage); }
.block-card.tag-ritual .block-accent { background: var(--gold); }
.block-card.tag-matcha .block-accent { background: #6a8a48; }
.block-card.tag-focus .block-accent { background: #4a7a68; }
.block-card.tag-rest .block-accent { background: #9a7a88; }
.block-card.tag-sacred .block-accent { background: var(--terra); }

.block-inner {
  flex: 1; padding: 12px 14px 10px;
}
.block-top {
  display: flex; justify-content: space-between;
  align-items: flex-start; margin-bottom: 3px;
}
.block-time {
  font-family: 'Jost', sans-serif; font-size: 10px; font-weight: 300;
  color: var(--dust); letter-spacing: .06em;
}
.block-pill {
  font-family: 'Jost', sans-serif; font-size: 8px; font-weight: 400;
  letter-spacing: .1em; text-transform: uppercase;
  padding: 2px 7px; border-radius: 10px;
}
.pill-run    { background: rgba(90,120,72,.12); color: var(--sage); }
.pill-ritual { background: rgba(160,120,48,.1); color: var(--gold); }
.pill-matcha { background: rgba(90,130,60,.12); color: #5a8840; }
.pill-focus  { background: rgba(60,110,100,.1); color: #4a8878; }
.pill-rest   { background: rgba(140,100,120,.1); color: #8a6878; }
.pill-sacred { background: rgba(184,92,56,.1); color: var(--terra); }

.block-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 16px; font-weight: 400; color: var(--ink);
  line-height: 1.3; margin-bottom: 3px;
}
.block-note {
  font-family: 'Cormorant Garamond', serif;
  font-size: 13px; font-style: italic; color: var(--stone);
  line-height: 1.6; display: none;
}
.block-card.expanded .block-note { display: block; }
.block-play-btn {
  display: none; margin-top: 8px;
}
.block-card.expanded .block-play-btn { display: flex; }
.block-play-btn button {
  font-family: 'Jost', sans-serif; font-size: 10px; font-weight: 400;
  letter-spacing: .1em; text-transform: uppercase;
  color: var(--terra); background: none; border: 1px solid rgba(184,92,56,.3);
  border-radius: 20px; padding: 5px 12px; cursor: pointer;
}
.block-play-btn button:active { background: rgba(184,92,56,.08); }

/* ── AUDIO WAVE INDICATOR ── */
.wave-indicator {
  display: none; align-items: center; gap: 2px; margin-left: 8px;
}
.block-card.playing .wave-indicator { display: flex; }
.wave-bar {
  width: 2px; background: var(--terra); border-radius: 1px;
  animation: wave 0.8s ease-in-out infinite;
}
.wave-bar:nth-child(1) { height: 6px; animation-delay: 0s; }
.wave-bar:nth-child(2) { height: 10px; animation-delay: 0.15s; }
.wave-bar:nth-child(3) { height: 7px; animation-delay: 0.3s; }
.wave-bar:nth-child(4) { height: 12px; animation-delay: 0.1s; }
@keyframes wave {
  0%,100% { transform: scaleY(1); }
  50% { transform: scaleY(0.4); }
}

/* ── DAY SELECTOR ── */
.day-selector {
  padding: 6px 20px 0;
  display: flex; gap: 6px; overflow-x: auto;
  scrollbar-width: none;
}
.day-selector::-webkit-scrollbar { display: none; }
.day-btn {
  flex-shrink: 0;
  font-family: 'Jost', sans-serif; font-size: 10px; font-weight: 400;
  letter-spacing: .1em; text-transform: uppercase;
  padding: 7px 14px; border-radius: 20px;
  border: 1px solid rgba(168,120,80,.2);
  background: transparent; color: var(--dust); cursor: pointer;
  transition: all .18s;
}
.day-btn.active {
  background: var(--terra); border-color: var(--terra);
  color: #fff; box-shadow: 0 3px 10px rgba(184,92,56,.2);
}

/* ── AUDIO STATUS BAR ── */
.audio-bar {
  position: fixed; bottom:0; left:0; right:0; z-index:200;
  padding: 12px 20px calc(var(--safe-bot) + 12px);
  background: rgba(245,237,224,.96);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-top: 1px solid rgba(168,120,80,.12);
  display: flex; align-items: center; gap: 12px;
  max-width: 100%;
}
.audio-bar.hidden { display: none; }
.audio-now-playing {
  flex: 1;
  font-family: 'Cormorant Garamond', serif;
  font-size: 14px; font-style: italic; color: var(--stone);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.audio-stop-btn {
  font-family: 'Jost', sans-serif; font-size: 10px; font-weight: 400;
  letter-spacing: .1em; text-transform: uppercase;
  color: var(--terra); background: rgba(184,92,56,.08);
  border: 1px solid rgba(184,92,56,.2);
  border-radius: 20px; padding: 6px 14px; cursor: pointer;
  flex-shrink: 0;
}
.audio-mini-wave {
  display: flex; gap: 2px; align-items: center; flex-shrink: 0;
}
.audio-mini-wave .wave-bar { background: var(--terra); }

/* ── EIGHT HABITS TAB ── */
.habits-section { padding: 8px 12px 0; }
.habit-item {
  display: flex; gap: 14px; padding: 14px 14px;
  background: var(--cream); border-radius: 12px;
  border: 1px solid rgba(168,120,80,.1);
  margin-bottom: 6px; cursor: pointer;
  transition: transform .15s;
}
.habit-item:active { transform: scale(.98); }
.habit-num {
  font-family: 'Cormorant Garamond', serif; font-size: 28px;
  font-weight: 300; color: rgba(184,92,56,.2); line-height: 1;
  flex-shrink: 0; width: 32px;
}
.habit-content {}
.habit-title-sm {
  font-family: 'Cormorant Garamond', serif; font-size: 17px;
  font-weight: 400; color: var(--ink); margin-bottom: 2px;
}
.habit-tag-sm {
  font-family: 'Jost', sans-serif; font-size: 9px; font-weight: 300;
  color: var(--dust); letter-spacing: .04em;
}
.habit-body-sm {
  display: none; margin-top: 10px; padding-top: 10px;
  border-top: 1px solid rgba(168,120,80,.1);
}
.habit-item.open .habit-body-sm { display: block; }
.habit-body-text {
  font-family: 'Cormorant Garamond', serif; font-size: 15px;
  color: var(--stone); line-height: 1.75; margin-bottom: 8px;
}
.habit-body-practice {
  font-family: 'Cormorant Garamond', serif; font-size: 14px;
  font-style: italic; color: var(--terra); line-height: 1.7;
  padding: 8px 12px; background: rgba(184,92,56,.06);
  border-radius: 8px; border-left: 2px solid var(--terra);
}
.habit-speak-btn {
  margin-top: 10px;
  font-family: 'Jost', sans-serif; font-size: 10px; font-weight: 400;
  letter-spacing: .1em; text-transform: uppercase;
  color: var(--terra); background: none;
  border: 1px solid rgba(184,92,56,.25); border-radius: 20px;
  padding: 6px 14px; cursor: pointer;
}

/* ── TAB BAR ── */
.tab-bar {
  position: fixed; top:0; left:0; right:0; z-index:101;
  background: rgba(245,237,224,.97);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid rgba(168,120,80,.15);
  display: flex; padding-top: var(--safe-top);
}
.tab-item {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; padding: 10px 4px 6px;
  cursor: pointer; transition: opacity .15s;
  border: none; background: none;
}
.tab-item:active { opacity: .6; }
.tab-icon { font-size: 17px; margin-bottom: 1px; }
.tab-label {
  font-family: 'Jost', sans-serif; font-size: 9px; font-weight: 400;
  letter-spacing: .05em; text-transform: uppercase; color: var(--dust);
}
.tab-item.active .tab-label { color: var(--terra); }
.tab-item.active .tab-icon { filter: none; }

/* ── VIEWS ── */
.view { display: none; }
.view.active { display: block; }

/* ── QUOTE CARD ── */
.quote-card {
  margin: 16px 12px 0;
  background: linear-gradient(135deg, rgba(184,92,56,.08), rgba(160,120,48,.06));
  border-radius: 12px; padding: 18px 18px;
  border: 1px solid rgba(168,120,80,.15);
}
.quote-text {
  font-family: 'Cormorant Garamond', serif; font-size: 16px;
  font-style: italic; color: var(--stone); line-height: 1.75;
  margin-bottom: 6px;
}
.quote-source {
  font-family: 'Jost', sans-serif; font-size: 9px; font-weight: 300;
  color: var(--dust); letter-spacing: .1em; text-transform: uppercase;
}
.quote-speak {
  margin-top: 12px;
  font-family: 'Jost', sans-serif; font-size: 10px; font-weight: 400;
  letter-spacing: .1em; text-transform: uppercase;
  color: var(--terra); background: none;
  border: 1px solid rgba(184,92,56,.25); border-radius: 20px;
  padding: 6px 14px; cursor: pointer; display: block;
}

/* ── CHECKBOX ── */
.block-check {
  width: 22px; height: 22px; border-radius: 50%;
  border: 1.5px solid rgba(168,120,80,.3);
  flex-shrink: 0; display: flex; align-items: center; justify-content: center;
  margin: auto 8px auto 10px; cursor: pointer;
  transition: all .2s; background: transparent; align-self: center;
}
.block-check.checked { background: var(--sage); border-color: var(--sage); }
.block-check.checked::after { content: '✓'; color: #fff; font-size: 12px; }
.block-card.done .block-title { text-decoration: line-through; opacity: .7; }
.block-card.done { opacity: .55; }

/* ── MONEY CARDS ── */
.money-card {
  margin: 0 12px 10px; background: var(--cream); border-radius: 14px;
  border: 1px solid rgba(168,120,80,.12); border-left: 4px solid var(--gold);
  padding: 18px; cursor: pointer; transition: transform .15s;
}
.money-card:active { transform: scale(.98); }
.money-card-label {
  font-family: Jost,sans-serif; font-size: 9px; font-weight: 400;
  letter-spacing: .2em; text-transform: uppercase; color: var(--gold); margin-bottom: 5px;
}
.money-card-title {
  font-family: Cormorant Garamond,serif; font-size: 18px;
  font-weight: 400; color: var(--ink); margin-bottom: 6px;
}
.money-card-text {
  font-family: Cormorant Garamond,serif; font-size: 15px;
  color: var(--stone); line-height: 1.75; font-style: italic; margin-bottom: 8px;
}
.money-card-action {
  font-family: Jost,sans-serif; font-size: 10px; font-weight: 300;
  color: var(--terra); letter-spacing: .04em; line-height: 1.6;
}

/* ── DINNER ── */
.dinner-hero {
  margin: 16px 12px 12px; background: var(--terra);
  border-radius: 16px; padding: 22px 20px;
  position: relative; overflow: hidden;
}
.dinner-hero::before {
  content:''; position:absolute; top:-20px; right:-20px;
  width:100px; height:100px; border-radius:50%; background:rgba(255,255,255,.08);
}
.dinner-hero-label {
  font-family: Jost,sans-serif; font-size: 10px; font-weight: 300;
  letter-spacing: .16em; text-transform: uppercase; color: rgba(255,255,255,.7); margin-bottom: 6px;
}
.dinner-hero-title {
  font-family: Cormorant Garamond,serif; font-size: 26px;
  font-weight: 400; color: #fff; line-height: 1.2; margin-bottom: 8px;
}
.dinner-hero-note {
  font-family: Cormorant Garamond,serif; font-size: 15px;
  font-style: italic; color: rgba(255,255,255,.82); line-height: 1.6; margin-bottom: 16px;
}
.dinner-tags { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px; }
.dinner-tag {
  font-family: Jost,sans-serif; font-size: 9px; font-weight: 400;
  letter-spacing: .1em; text-transform: uppercase;
  padding: 3px 10px; border-radius: 20px;
  background: rgba(255,255,255,.18); color: rgba(255,255,255,.9);
}
.dinner-btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  background: rgba(255,255,255,.2); border: 1px solid rgba(255,255,255,.35);
  border-radius: 50px; padding: 11px 20px; width: 100%;
  font-family: Jost,sans-serif; font-size: 12px; font-weight: 400;
  letter-spacing: .08em; color: #fff; cursor: pointer; transition: background .2s;
}
.dinner-btn:active { background: rgba(255,255,255,.3); }
.dinner-card {
  margin: 0 12px 10px; background: var(--cream);
  border-radius: 14px; border: 1px solid rgba(168,120,80,.12); padding: 18px;
}
.dinner-card-cuisine {
  font-family: Jost,sans-serif; font-size: 9px; font-weight: 400;
  letter-spacing: .18em; text-transform: uppercase; color: var(--terra); margin-bottom: 5px;
}
.dinner-card-name {
  font-family: Cormorant Garamond,serif; font-size: 22px;
  font-weight: 400; color: var(--ink); margin-bottom: 6px;
}
.dinner-card-desc {
  font-family: Cormorant Garamond,serif; font-size: 15px;
  color: var(--stone); line-height: 1.75; font-style: italic; margin-bottom: 12px;
}
.dinner-card-steps {
  font-family: Cormorant Garamond,serif; font-size: 15px;
  color: var(--ink); line-height: 1.8;
}
.dinner-card-ingredients {
  font-family: Jost,sans-serif; font-size: 11px; font-weight: 300;
  color: var(--dust); letter-spacing: .03em; line-height: 1.8; margin-bottom: 10px;
}


/* ── HUNDRED ACRE WOOD BACKGROUND ── */
.wood-bg {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  overflow: hidden;
}
.wood-bg svg { width: 100%; height: 100%; }

/* ── FLOATING CHARACTERS ── */
.pooh-character {
  display: flex; justify-content: center; padding: 8px 0 4px;
  pointer-events: none; opacity: 0.55;
}
.pooh-divider {
  display: flex; align-items: center; gap: 10px;
  padding: 6px 20px; opacity: 0.45;
}
.pooh-divider-line {
  flex: 1; height: 1px; background: rgba(168,120,80,.2);
}
.pooh-divider-text {
  font-family: Cormorant Garamond, serif; font-size: 12px;

// ── TOKEN TRACKING ────────────────────────────────────────────────────
var sessionTokens = { input:0, output:0, calls:0 };
var TOKEN_COST = { input:0.15, output:0.60 };
function trackTokens(usage) {
  if (!usage) return '';
  sessionTokens.input += (usage.input_tokens||0);
  sessionTokens.output += (usage.output_tokens||0);
  sessionTokens.calls += 1;
  var cost = (sessionTokens.input/1e6*TOKEN_COST.input)+(sessionTokens.output/1e6*TOKEN_COST.output);
  return (usage.input_tokens||0)+' in · '+(usage.output_tokens||0)+' out · $'+cost.toFixed(4);
}

  var wkHtml='';
  for(var i=0;i<7;i++){var we=r7[i]||{},wh=(we.bedtime&&we.wake)?calcSleepHours(we.bedtime,we.wake):0;var wd=we.date?new Date(we.date+'T12:00').toLocaleDateString('en',{weekday:'short'}):days[i];var wdot=we.quality?qe[we.quality-1]:'';wkHtml+='<div class="sleep-week-col"><div style="font-size:8px;color:var(--dust);margin-bottom:2px">'+(wh>0?wh.toFixed(1)+'h':'')+'</div><div class="sleep-week-fill" style="height:'+Math.max((wh/maxH)*46,wh>0?3:0)+'px"></div><div class="sleep-week-lbl">'+wd+'</div><div style="font-size:9px">'+wdot+'</div></div>';}
  var logHtml='';log.slice(-5).reverse().forEach(function(le){var dur=(le.bedtime&&le.wake)?calcSleepHours(le.bedtime,le.wake).toFixed(1)+'h':'—';var ql=le.quality?qe[le.quality-1]:'—';var nl=(le.energy!=null)?ne[le.energy]:'—';var dl=new Date(le.date+'T12:00').toLocaleDateString('en',{weekday:'short',month:'short',day:'numeric'});logHtml+='<div class="sleep-log-row"><span style="font-family:Jost,sans-serif;font-size:10px;color:var(--dust)">'+dl+'</span><span style="font-family:Cormorant Garamond,serif;font-size:14px;color:var(--stone)">'+dur+' &nbsp;'+ql+' &nbsp;'+nl+'</span></div>';});
  function suppRow(s){var done=!!suppLog[s.id];return '<div class="supp-item"><div><div style="font-family:Cormorant Garamond,serif;font-size:15px;color:var(--ink)">'+s.icon+' '+s.name+' <span style="font-family:Jost,sans-serif;font-size:10px;font-weight:300;color:var(--dust)">'+s.dose+'</span></div><div style="font-family:Jost,sans-serif;font-size:9px;color:var(--dust);margin-top:2px">'+s.note+'</div></div><button class="supp-check'+(done?' done':'')+'" onclick="toggleSupp(\''+s.id+'\')"><span>'+(done?'✓':'')+'</span></button></div>';}
  var mornS=SUPPLEMENTS.filter(function(s){return s.time==='morning';}),eveS=SUPPLEMENTS.filter(function(s){return s.time==='evening';});
  var dow=new Date().getDay(),fidx=dow===0?6:dow-1;
  var fitHtml='';FITNESS_PLAN.forEach(function(plan,i){var isToday=(i===fidx);var exHtml='';plan.exercises.forEach(function(ex){exHtml+='<div class="fitness-exercise"><div class="fitness-ex-name">'+ex.name+'</div><div class="fitness-ex-detail">'+ex.detail+'</div></div>';});fitHtml+='<div class="fitness-day'+(isToday?' open':'')+'" id="fit-day-'+i+'"><div class="fitness-day-header" onclick="toggleFitnessDay('+i+')"><div class="fitness-day-name">'+(isToday?'<span style="color:var(--terra)">Today · </span>':'')+plan.day+'</div><div class="fitness-day-tag">'+plan.tag+'</div></div><div class="fitness-day-body" style="padding-top:10px">'+exHtml+'</div></div>';});
  var tips=getContextualTips(entry,log),tipsHtml='';tips.forEach(function(tip){tipsHtml+='<div style="margin:0 12px 8px;background:rgba(184,92,56,.06);border-radius:14px;padding:14px 16px;border-left:3px solid var(--terra)"><div style="font-family:Jost,sans-serif;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--terra);margin-bottom:4px">'+tip.icon+' '+tip.title+'</div><div style="font-family:Cormorant Garamond,serif;font-size:14px;color:var(--stone);line-height:1.75">'+tip.body+'</div></div>';});

  document.getElementById('mainContent').innerHTML =
    '<div class="sleep-card"><div class="sleep-section-title">Tonight / This Morning</div><div class="sleep-time-row"><div class="sleep-time-block"><div class="sleep-time-label">Bedtime</div><input class="sleep-time-input" type="time" value="'+(entry.bedtime||'22:30')+'" onchange="setSleepTime(&quot;bedtime&quot;,this.value)"></div><div class="sleep-time-block"><div class="sleep-time-label">Wake up</div><input class="sleep-time-input" type="time" value="'+(entry.wake||'07:00')+'" onchange="setSleepTime(&quot;wake&quot;,this.value)"></div></div>'+durStr+'<div class="sleep-section-title" style="margin-top:14px">Sleep quality</div><div class="sleep-rating-row">'+qBtns+'</div><div class="sleep-section-title">Morning energy</div><div class="sleep-energy-row">'+nBtns+'</div></div>'+
    '<div class="sleep-card" style="margin-top:10px"><div class="sleep-section-title">Phone-free wind-down timer</div><div style="text-align:center;padding:8px 0"><div style="font-family:Cormorant Garamond,serif;font-size:48px;color:var(--ink);font-style:italic;line-height:1" id="sleepTimerDisplay">'+fmtTimer(tv)+'</div><div style="font-family:Jost,sans-serif;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--dust);margin-top:4px">'+(sleepTimerRunning?'put the phone down':'phone-free')+'</div><div style="display:flex;gap:8px;justify-content:center;margin-top:10px">'+['10','20','30'].map(function(m){return'<button onclick="setSleepTimerDur('+m+')" style="font-family:Jost,sans-serif;font-size:10px;color:var(--dust);background:none;border:1px solid rgba(168,120,80,.2);border-radius:20px;padding:4px 12px;cursor:pointer">'+m+'m</button>';}).join('')+'</div>'+tBtn+'</div></div>'+
    '<div class="sleep-card" style="margin-top:10px"><div class="sleep-section-title">Supplements · Today</div><div style="font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--dust);margin-bottom:8px">Morning</div>'+mornS.map(suppRow).join('')+'<div style="font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--dust);margin-top:12px;margin-bottom:8px">Evening</div>'+eveS.map(suppRow).join('')+'</div>'+
    '<div class="sleep-card" style="margin-top:10px"><div class="sleep-section-title">This week · sleep</div><div class="sleep-week-chart">'+wkHtml+'</div></div>'+
    (logHtml?'<div class="sleep-card" style="margin-top:10px"><div class="sleep-section-title">Recent nights</div>'+logHtml+'</div>':'')+
    '<div style="padding:14px 12px 4px"><div style="font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--terra)">Fitness · Weekly Plan</div><div style="font-family:Cormorant Garamond,serif;font-size:13px;font-style:italic;color:var(--dust);margin-top:4px;margin-bottom:10px">Tailored for running + lifting · tap to expand</div></div>'+
    '<div style="padding:0 12px">'+fitHtml+'</div>'+
    '<div style="padding:14px 12px 4px"><div style="font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--terra)">Sleep tips for you</div></div>'+
    tipsHtml+'<div style="height:24px"></div>';
}

// ── API SETTINGS OVERLAY ──────────────────────────────────────────────
function apiInputHint(val){var h=document.getElementById('apiTypeHint');if(!h)return;if(!val){h.textContent='';return;}if(val.startsWith('sk-ant-'))h.textContent='✓ Anthropic key';else if(val.startsWith('sk-'))h.textContent='✓ OpenAI key';else if(val.startsWith('http'))h.textContent='✓ Worker URL';else h.textContent='⚠ Expected sk-ant-…, sk-…, or https://…';}
function openApiSettings(){var el=document.getElementById('apiOverlay');el.style.display='flex';var owner=isOwnerUnlocked();document.getElementById('ownerBadge').style.display=owner?'block':'none';document.getElementById('apiSettingsMain').style.display=owner?'none':'block';document.getElementById('pinEntry').style.display='none';document.getElementById('resetBtn').textContent=owner?'Sign out':'Clear settings';var stored='';try{stored=localStorage.getItem('bloom_api')||'';}catch(e){}var inp=document.getElementById('proxyInput');inp.value=stored;apiInputHint(stored);inp.oninput=function(){apiInputHint(this.value.trim());};try{document.getElementById('sheetsIdInput').value=localStorage.getItem('bloom_sheets_id')||'';document.getElementById('sheetsKeyInput').value=localStorage.getItem('bloom_sheets_key')||'';}catch(e){}var cost=(sessionTokens.input/1e6*TOKEN_COST.input)+(sessionTokens.output/1e6*TOKEN_COST.output);document.getElementById('sessionUsageDisplay').innerHTML=sessionTokens.calls===0?'No API calls this session.':sessionTokens.calls+' call'+(sessionTokens.calls>1?'s':'')+' · '+sessionTokens.input+' in · '+sessionTokens.output+' out<br>Est. cost: <strong>$'+cost.toFixed(4)+'</strong>';}
function closeApiSettings(){document.getElementById('apiOverlay').style.display='none';}
function saveApiSettings(){var val=document.getElementById('proxyInput').value.trim();try{if(val)localStorage.setItem('bloom_api',val);else localStorage.removeItem('bloom_api');var sid=document.getElementById('sheetsIdInput').value.trim();var sk=document.getElementById('sheetsKeyInput').value.trim();if(sid)localStorage.setItem('bloom_sheets_id',sid);else localStorage.removeItem('bloom_sheets_id');if(sk)localStorage.setItem('bloom_sheets_key',sk);else localStorage.removeItem('bloom_sheets_key');}catch(e){}closeApiSettings();}
function clearApiSettings(){try{['bloom_api','bloom_sheets_id','bloom_sheets_key','bloom_owner'].forEach(function(k){localStorage.removeItem(k);});}catch(e){}['proxyInput','sheetsIdInput','sheetsKeyInput'].forEach(function(id){document.getElementById(id).value='';});closeApiSettings();}
function showPinEntry(){document.getElementById('apiSettingsMain').style.display='none';document.getElementById('pinEntry').style.display='block';document.getElementById('pinInput').value='';document.getElementById('pinError').textContent='';setTimeout(function(){document.getElementById('pinInput').focus();},100);}
function hidePinEntry(){document.getElementById('pinEntry').style.display='none';document.getElementById('apiSettingsMain').style.display='block';}
function submitPin(){var pin=document.getElementById('pinInput').value;if(!pin)return;if(checkPin(pin)){try{localStorage.setItem('bloom_owner','1');}catch(e){}closeApiSettings();}else{document.getElementById('pinError').textContent='Incorrect PIN';document.getElementById('pinInput').value='';}}
document.addEventListener('DOMContentLoaded',function(){var pi=document.getElementById('pinInput');if(pi)pi.addEventListener('keydown',function(e){if(e.key==='Enter')submitPin();});});

// ── LOFI ──────────────────────────────────────────────────────────────
var lofiPlaying=false;
function setMusicOn(){lofiPlaying=true;var b=document.getElementById('musicBtn');document.getElementById('musicIcon').innerHTML='<span class="music-wave"><span></span><span></span><span></span></span>';document.getElementById('musicLabel').textContent='on';b.style.background='rgba(90,120,72,.15)';b.style.borderColor='rgba(90,120,72,.3)';b.style.color='var(--sage)';}
function setMusicOff(){lofiPlaying=false;var b=document.getElementById('musicBtn');document.getElementById('musicIcon').textContent='\u266a';document.getElementById('musicLabel').textContent='lofi';b.style.background='rgba(184,92,56,.1)';b.style.borderColor='rgba(184,92,56,.2)';b.style.color='var(--terra)';}
function toggleLofi(){var audio=document.getElementById('lofiAudio');if(!audio)return;if(lofiPlaying){audio.pause();setMusicOff();return;}if(audio.readyState===0)audio.load();var b=document.getElementById('musicBtn');if(b)b.style.opacity='.5';audio.play().then(function(){setMusicOn();if(b)b.style.opacity='1';}).catch(function(){if(b)b.style.opacity='1';setMusicOff();var l=document.getElementById('musicLabel');if(l){l.textContent='error';setTimeout(function(){l.textContent='lofi';},2500);}});}

// ── SWITCH TAB ────────────────────────────────────────────────────────
function switchTab(tab) {
  currentTab=tab;
  document.querySelectorAll('.tab-item').forEach(t=>t.classList.remove('active'));
  var tabEl=document.getElementById('tab-'+tab); if(tabEl)tabEl.classList.add('active');
  document.querySelectorAll('.tab-bg').forEach(b=>b.classList.remove('active'));
  var bg=document.getElementById('tabBg-'+tab); if(bg)bg.classList.add('active');
  if(tab==='today')       renderToday();
  else if(tab==='habits') renderHabits();
  else if(tab==='money')  renderMoney();
  else if(tab==='dinner') renderDinner();
  else if(tab==='voice')  renderVoice();
  else if(tab==='sleep')  renderSleep();
}

// ── CLOCK + AUTO-REFRESH ──────────────────────────────────────────────
function updateClock(){document.getElementById('liveTime').textContent=formatTime();}
setInterval(updateClock,30000); updateClock();
setInterval(function(){if(currentTab==='today'){var isToday=viewDay===(new Date().getDay()===0?6:new Date().getDay()-1);if(isToday)renderToday();}},60000);

// ── INIT ──────────────────────────────────────────────────────────────
renderToday();
if('serviceWorker'in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('./blossom-sw.js').catch(function(e){console.log('SW:',e.message);});});}

</script>

<div id="tabBg-sleep" class="tab-bg" style="background:#f0edf5"></div>

<!-- API SETTINGS OVERLAY -->
<div id="apiOverlay" style="display:none;position:fixed;inset:0;z-index:999;background:rgba(42,30,20,.7);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);align-items:center;justify-content:center">
  <div style="background:var(--cream);border-radius:20px;padding:28px 24px;max-width:340px;width:90%;margin:0 auto;max-height:85vh;overflow-y:auto">
    <div style="font-family:Cormorant Garamond,serif;font-size:22px;font-style:italic;color:var(--terra);margin-bottom:6px">API Settings</div>
    <div id="ownerBadge" style="display:none;font-family:Jost,sans-serif;font-size:10px;letter-spacing:.08em;color:var(--sage);background:rgba(90,120,72,.1);border-radius:20px;padding:4px 12px;margin-bottom:12px;text-align:center">✓ Using owner API</div>
    <div id="apiSettingsMain">
      <div style="font-family:Jost,sans-serif;font-size:11px;color:var(--stone);margin-bottom:16px;line-height:1.8">Enter your own API key to use food suggestions.<br><span style="color:var(--terra)">sk-ant-…</span> Anthropic &nbsp;<span style="color:var(--terra)">sk-…</span> OpenAI &nbsp;<span style="color:var(--terra)">https://…</span> Worker</div>
      <div style="font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--terra);margin-bottom:6px">API key or Worker URL</div>
      <input id="proxyInput" type="text" placeholder="sk-ant-… · sk-… · https://…" style="width:100%;box-sizing:border-box;font-family:Jost,sans-serif;font-size:12px;padding:10px 12px;border:1px solid rgba(168,120,80,.3);border-radius:10px;background:var(--bg);color:var(--ink);outline:none;margin-bottom:6px">
      <div id="apiTypeHint" style="font-size:10px;color:var(--sage);margin-bottom:8px;min-height:16px"></div>
      <div style="text-align:center;margin-bottom:12px"><button onclick="showPinEntry()" style="font-family:Jost,sans-serif;font-size:10px;color:var(--dust);background:none;border:none;cursor:pointer;letter-spacing:.06em">Have a PIN? →</button></div>
    </div>
    <div id="pinEntry" style="display:none;margin-bottom:12px">
      <div style="font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--terra);margin-bottom:6px">Owner PIN</div>
      <input id="pinInput" type="password" placeholder="Enter PIN" style="width:100%;box-sizing:border-box;font-family:Jost,sans-serif;font-size:14px;padding:10px 12px;border:1px solid rgba(168,120,80,.3);border-radius:10px;background:var(--bg);color:var(--ink);outline:none;margin-bottom:6px;letter-spacing:.3em">
      <div id="pinError" style="font-size:10px;color:var(--terra);margin-bottom:8px;min-height:14px"></div>
      <button onclick="submitPin()" style="width:100%;font-family:Jost,sans-serif;font-size:11px;font-weight:400;letter-spacing:.1em;text-transform:uppercase;background:var(--terra);color:#fff;border:none;border-radius:50px;padding:10px;cursor:pointer;margin-bottom:8px">Unlock</button>
      <div style="text-align:center"><button onclick="hidePinEntry()" style="font-family:Jost,sans-serif;font-size:10px;color:var(--dust);background:none;border:none;cursor:pointer">← Back</button></div>
    </div>
    <div style="font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--terra);margin-bottom:6px">Google Sheets sync</div>
    <input id="sheetsIdInput" type="text" placeholder="Spreadsheet ID (from URL)" style="width:100%;box-sizing:border-box;font-family:Jost,sans-serif;font-size:12px;padding:8px 12px;border:1px solid rgba(168,120,80,.3);border-radius:10px;background:var(--bg);color:var(--ink);outline:none;margin-bottom:6px">
    <input id="sheetsKeyInput" type="text" placeholder="Google API key" style="width:100%;box-sizing:border-box;font-family:Jost,sans-serif;font-size:12px;padding:8px 12px;border:1px solid rgba(168,120,80,.3);border-radius:10px;background:var(--bg);color:var(--ink);outline:none;margin-bottom:4px">
    <div style="font-family:Jost,sans-serif;font-size:10px;color:var(--dust);margin-bottom:14px;line-height:1.7">Recipes save as tabs: <em>Recipe 01 — Dinner</em> etc.</div>
    <div style="font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--terra);margin-bottom:6px">Session usage</div>
    <div id="sessionUsageDisplay" style="font-family:Jost,sans-serif;font-size:11px;color:var(--stone);margin-bottom:18px;background:rgba(168,120,80,.07);border-radius:8px;padding:8px 10px"></div>
    <div style="display:flex;gap:10px">
      <button onclick="saveApiSettings()" style="flex:1;font-family:Jost,sans-serif;font-size:11px;font-weight:400;letter-spacing:.1em;text-transform:uppercase;background:var(--terra);color:#fff;border:none;border-radius:50px;padding:10px;cursor:pointer">Save</button>
      <button onclick="closeApiSettings()" style="font-family:Jost,sans-serif;font-size:11px;font-weight:400;letter-spacing:.1em;text-transform:uppercase;background:none;color:var(--stone);border:1px solid rgba(168,120,80,.3);border-radius:50px;padding:10px 16px;cursor:pointer">Cancel</button>
    </div>
    <div style="text-align:center;margin-top:14px"><button onclick="clearApiSettings()" id="resetBtn" style="font-family:Jost,sans-serif;font-size:10px;color:var(--dust);background:none;border:none;cursor:pointer;letter-spacing:.06em">Clear settings</button></div>
  </div>
</div>

</body>
