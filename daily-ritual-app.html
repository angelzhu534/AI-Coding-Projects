<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Daily Ritual">
<meta name="theme-color" content="#0f1a0e">
<link rel="manifest" href="ritual-manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<title>Daily Ritual</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --deep:#0f1a0e;
  --deep2:#162015;
  --deep3:#1e2d1c;
  --terra:#c4724a;
  --terra-l:#d4926a;
  --gold:#c8a96a;
  --gold-l:#dfc28a;
  --sage:#7a9a6e;
  --sage-l:#a0bc94;
  --cream:#f2ead8;
  --sand:#e0d0b0;
  --dust:#8a8070;
  --stone:#5a5448;
  --petal:#e8b4a0;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}

html,body{
  height:100%;
  background:var(--deep);
  color:var(--sand);
  font-family:'Jost',sans-serif;
  font-weight:300;
  overscroll-behavior:none;
}

/* ── BOTANICAL BACKGROUND ── */
.botanical-bg{
  position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
}

/* ── HEADER ── */
.app-header{
  position:fixed;top:0;left:0;right:0;z-index:100;
  padding:calc(var(--safe-top) + 14px) 22px 0;
}
.header-blur{
  position:absolute;inset:0;
  background:linear-gradient(to bottom,rgba(15,26,14,.96) 70%,rgba(15,26,14,0));
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  z-index:-1;
}
.header-top{
  display:flex;justify-content:space-between;align-items:baseline;
  margin-bottom:16px;
}
.app-title{
  font-family:'Cormorant Garamond',serif;
  font-size:26px;color:var(--cream);font-style:italic;font-weight:300;
  letter-spacing:.02em;
}
.header-date{
  font-size:9px;letter-spacing:.38em;text-transform:uppercase;color:var(--dust);
}

/* ── DAY TABS ── */
.day-tabs{
  display:grid;grid-template-columns:repeat(7,1fr);
  margin:0 -22px;
}
.day-tab{
  text-align:center;padding:7px 2px 9px;
  font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--stone);cursor:pointer;
  border-bottom:1.5px solid transparent;
  transition:all .25s;-webkit-user-select:none;user-select:none;
}
.day-tab:active{color:var(--sand)}
.day-tab.active{color:var(--cream);border-bottom-color:var(--terra)}

/* ── PROGRESS ── */
.progress-wrap{height:1.5px;background:rgba(255,255,255,.06);margin:0 -22px}
.progress-fill{height:100%;background:linear-gradient(to right,var(--terra),var(--gold));transition:width .5s ease}

/* ── BODY ── */
.app-body{
  position:relative;z-index:1;
  padding-top:calc(var(--safe-top) + 142px);
  padding-bottom:calc(var(--safe-bottom) + 76px);
  height:100%;overflow-y:auto;
  -webkit-overflow-scrolling:touch;
}

/* ── BLOCKS ── */
.r-block{padding:0 22px;margin-bottom:2px}
.r-time-label{
  font-size:8px;letter-spacing:.45em;text-transform:uppercase;
  color:var(--terra);padding:22px 0 10px;
  border-bottom:1px solid rgba(196,114,74,.12);margin-bottom:2px;
  display:flex;align-items:center;gap:10px;
}
.r-time-label::after{content:'';flex:1;height:1px;background:linear-gradient(to right,rgba(196,114,74,.12),transparent)}
.routine-list{list-style:none}

/* ── ITEMS ── */
.r-item{
  display:flex;align-items:flex-start;gap:14px;
  padding:14px 4px;
  border-bottom:1px solid rgba(255,255,255,.04);
  cursor:pointer;-webkit-user-select:none;user-select:none;
  transition:all .2s;border-radius:3px;
  position:relative;
}
.r-item:active{background:rgba(255,255,255,.03)}

/* done shimmer */
.r-item.done::before{
  content:'';position:absolute;inset:0;border-radius:3px;
  background:linear-gradient(90deg,transparent,rgba(196,168,90,.04),transparent);
  pointer-events:none;
}

.r-check{
  width:21px;height:21px;
  border:1.5px solid rgba(255,255,255,.15);
  border-radius:4px;flex-shrink:0;margin-top:1px;
  display:flex;align-items:center;justify-content:center;
  transition:all .25s;background:rgba(255,255,255,.03);
}
.r-item.done .r-check{
  background:var(--terra);border-color:var(--terra);
  box-shadow:0 0 12px rgba(196,114,74,.3);
}
.r-item.done .r-check::after{content:"✓";color:#fff;font-size:12px;font-weight:500}

.r-content{flex:1;min-width:0}
.r-title{
  font-size:14px;color:var(--sand);line-height:1.45;font-weight:400;
  transition:all .25s;
}
.r-item.done .r-title{
  color:var(--stone);
  text-decoration:line-through;
  text-decoration-color:rgba(255,255,255,.15);
}
.r-note{
  font-family:'Cormorant Garamond',serif;
  font-size:12.5px;font-style:italic;
  color:var(--stone);line-height:1.65;margin-top:5px;
  transition:color .25s;
}
.r-item.done .r-note{color:rgba(90,84,72,.6)}
.r-tag{
  display:inline-block;font-size:7px;letter-spacing:.22em;
  text-transform:uppercase;padding:2px 7px;border-radius:20px;margin-top:6px;
}
.r-tag.run   {background:rgba(100,140,80,.2);color:var(--sage-l);border:1px solid rgba(100,140,80,.2)}
.r-tag.ritual{background:rgba(200,169,106,.12);color:var(--gold);border:1px solid rgba(200,169,106,.2)}
.r-tag.focus {background:rgba(196,114,74,.12);color:var(--terra-l);border:1px solid rgba(196,114,74,.2);font-weight:500}
.r-tag.work  {background:rgba(90,84,72,.2);color:var(--dust);border:1px solid rgba(90,84,72,.25)}
.r-tag.rest  {background:rgba(80,110,130,.15);color:#8ab0c8;border:1px solid rgba(80,110,130,.2)}

/* ── FOOTER ── */
.app-footer{
  position:fixed;bottom:0;left:0;right:0;z-index:100;
  padding:10px 22px calc(var(--safe-bottom) + 10px);
  display:flex;align-items:center;gap:12px;
}
.footer-blur{
  position:absolute;inset:0;
  background:linear-gradient(to top,rgba(15,26,14,.96) 70%,rgba(15,26,14,0));
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);z-index:-1;
}
.footer-label{font-size:9px;letter-spacing:.3em;text-transform:uppercase;color:var(--stone);white-space:nowrap}
.footer-bar-wrap{flex:1;height:1.5px;background:rgba(255,255,255,.07);overflow:hidden}
.footer-bar-fill{height:100%;background:linear-gradient(to right,var(--terra),var(--gold));transition:width .5s ease}
.footer-count{font-size:11px;color:var(--terra);font-weight:500;white-space:nowrap;min-width:36px;text-align:right}
</style>
</head>

function getStorageKey(day) { return 'routine_day_' + day + '_' + new Date().toDateString(); }

function getChecked(day) {
  try { return JSON.parse(localStorage.getItem(getStorageKey(day)) || '{}'); } catch { return {}; }
}

function setChecked(day, key, val) {
  const c = getChecked(day);
  c[key] = val;
  try { localStorage.setItem(getStorageKey(day), JSON.stringify(c)); } catch {}
}

function toggleItem(day, key, li) {
  const c = getChecked(day);
  c[key] = !c[key];
  try { localStorage.setItem(getStorageKey(day), JSON.stringify(c)); } catch {}
  li.classList.toggle('done', !!c[key]);
  li.querySelector('.r-check').classList.toggle('checked', !!c[key]);
  recalcProgress(day);
}

function setDay(day, btn) {
  currentDay = day;
  document.querySelectorAll('.rd-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  renderRoutine(day);
}

function updateProgress(done, total) {
  const pct = total ? Math.round(done/total*100) : 0;
  document.getElementById('progress-bar').style.width = pct + '%';
  document.getElementById('progress-count').textContent = done + ' / ' + total;
}

function renderRoutine(day) {
  const body = document.getElementById('routine-body');
  const blocks = DAYS[day] || [];
  const checked = getChecked(day);
  let html = '';
  let totalItems = 0, doneItems = 0;

  blocks.forEach(block => {
    html += `<div class="r-block"><div class="r-time-label">${block.time}</div><ul class="routine-list">`;
    block.items.forEach((item, idx) => {
      const key = block.time + '_' + idx;
      const isDone = !!checked[key];
      if (isDone) doneItems++;
      totalItems++;
      html += `<li class="r-item${isDone?' done':''}" onclick="toggleItem(${day},'${key}',this)">
        <div class="r-check${isDone?' checked':''}"></div>
        <div class="r-content">
          <div class="r-title">${item.t}${item.tag?`<span class="r-tag ${item.tag}">${item.tag}</span>`:''}</div>
          ${item.note?`<div class="r-note">${item.note}</div>`:''}
        </div>
      </li>`;
    });
    html += '</ul></div>';
  });

  body.innerHTML = html;
  updateProgress(doneItems, totalItems);
}

function updateProgress(day) {
  const checked = getChecked(day);
  const blocks = DAYS[day] || [];
  const total = blocks.reduce((a, b) => a + b.items.length, 0);
  const done = Object.values(checked).filter(Boolean).length;
  const pct = total ? Math.round(done / total * 100) : 0;
  const hBar = document.getElementById('progress-bar');
  const fBar = document.getElementById('footer-bar');
  const count = document.getElementById('progress-count');
  if (hBar) hBar.style.width = pct + '%';
  if (fBar) fBar.style.width = pct + '%';
  if (count) count.textContent = done + ' / ' + total;
}

function init() {
  const now = new Date();
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const dayNames = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  document.getElementById('today-date').textContent =
    dayNames[now.getDay()] + ', ' + months[now.getMonth()] + ' ' + now.getDate();
  const currentDay = (now.getDay() + 6) % 7;
  const tabs = document.querySelectorAll('.day-tab');
  tabs.forEach((t, i) => { if (i === currentDay) t.classList.add('active'); });
  renderRoutine(currentDay);
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./ritual-sw.js', {scope: './'}).catch(() => {});
  });
}

// Re-check date whenever app comes back to foreground
// Handles: phone sitting open overnight, returning from another app, waking from sleep
let lastDate = new Date().toDateString();
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    const today = new Date().toDateString();
    if (today !== lastDate) {
      lastDate = today;
      init(); // reloads with the new day
    }
  }
});

init();
