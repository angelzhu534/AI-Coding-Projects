<h2>Your role at IPX Power</h2>
<div class="cd"><h3>What IPX Power does</h3><p>Develops, owns, and operates utility-scale solar and battery storage projects. Project lifecycle: development, permitting, financing, construction, commercial operation, long-term O&M. Legal ops touches every stage through contracts.</p></div>
<div class="cd"><h3>Your role as Legal Ops Specialist</h3><p style="margin-bottom:.4rem">You own the operational layer of every contract — not the legal substance. Attorneys make legal decisions. You prevent bottlenecks, track spending, and ensure every executed agreement is properly managed.</p><p>You are a financial gatekeeper and tracker — not a budget owner. The CFO/Finance team owns the budget. You make sure what's being spent matches what was approved and is reported accurately.</p></div>
<div class="wb"><p><span style="font-weight:500">Golden rule:</span> No work may begin and no invoices may be processed until a fully executed agreement is in place. A pending DocuSign signature is not an executed contract.</p></div>
<div class="tb"><p><span style="font-weight:500">Evisort rule:</span> If it's not in Evisort with obligation dates entered, it doesn't exist from a legal ops perspective.</p></div>
<div class="cd"><h3>The confirmed daily flow</h3><div class="fl"><span class="fp">Slack request</span><span class="fa">&rarr;</span><span class="fp">Evisort CLM</span><span class="fa">&rarr;</span><span class="fp">Brightflag e-billing</span><span class="fa">&rarr;</span><span class="fp">Stampli AP</span><span class="fa">&rarr;</span><span class="fp">Relativity archive</span></div></div>
<div class="ab2"><p><span style="font-weight:500">Important context:</span> Your original onboarding documents were hypothetically constructed. The signing authority matrix, SLAs, alert windows, and process steps are plausible but need verification against actual IPX Power policy once onboarded.</p></div>
<div class="cg">
<div class="cd" style="margin:0"><div class="bd bd-b">Before day 1</div><ul><li>Request Evisort admin access from Janelle</li><li>Request DocuSign via Slack #it-help</li><li>Request Relativity credentials</li><li>Join #legal-ops, #contracts, #general</li><li>Read contract lifecycle guide</li></ul></div>
<div class="cd" style="margin:0"><div class="bd bd-p">Week 1 focus</div><ul><li>Meet Janelle, Jen, Finance, Operations</li><li>Tour Evisort contract library</li><li>Understand paralegal boundaries</li><li>Shadow one intake end-to-end</li></ul></div>

sections.lifecycle=`
<h2>The 7-step contract lifecycle</h2>
<div class="wb"><p>Business teams should never go directly to attorneys. All contract requests route through legal ops first — this is how you maintain visibility across all active agreements.</p></div>
<div class="sf">
<div class="si"><div class="sn">1</div><div class="sb"><div class="st">Contract intake <span class="tc">Evisort</span></div><div class="ss">Business team submits via Evisort intake form or Slack. Identify contract type, confirm requesting party, counterparty, estimated value, target execution date. Check for template or counterparty paper. Create matter in Evisort and assign to the right attorney.</div></div></div>
<div class="si"><div class="sn">2</div><div class="sb"><div class="st">Documentation collection <span class="tc">Google Drive</span> <span class="tc">Evisort</span></div><div class="ss">PPAs: capacity, location, COD target, FERC status, interconnection status. Land: property description, title search, landowner contact. Vendors/OC: W-9, insurance cert, scope of work, signatory info, conflict check.</div></div></div>
<div class="si"><div class="sn">3</div><div class="sb"><div class="st">Attorney review and negotiation <span class="tc">Google Docs</span></div><div class="ss">Attorney-owned. You track status in Evisort, follow up if stalled, coordinate negotiation calls, maintain version control (tag each redline with date and party), flag delays vs SLA. You do not participate in substantive legal decisions.</div></div></div>
<div class="si"><div class="sn">4</div><div class="sb"><div class="st">Internal approval and signing authority <span class="tc">Evisort</span></div><div class="ss">Confirm contract value and identify required signatories per signing authority matrix. Route in Evisort, notify approvers via Slack with deadline. Follow up after 48 hours. Escalate to Janelle if unresponsive beyond 5 days. Finance must approve budget implications.</div></div></div>
<div class="si"><div class="sn">5</div><div class="sb"><div class="st">Execution via DocuSign <span class="tc">DocuSign</span></div><div class="ss">Create envelope with final approved version. Internal signatories first, then counterparty. Confirm counterparty name/title/email match the agreement. Monitor daily. Follow up after 48 hours pending. Download and store immediately upon completion.</div></div></div>
<div class="si"><div class="sn">6</div><div class="sb"><div class="st">Storage, tagging and obligation entry <span class="tc">Evisort</span></div><div class="ss">Upload to Evisort. Tag: contract type, counterparty, project, value. Enter all key dates: effective, expiration, renewal windows, COD, milestones. Set alerts at 180/90/60/30 days. Notify business team. Flag lender reporting for project finance. Copy to Relativity if litigation-relevant.</div></div></div>
<div class="si"><div class="sn">7</div><div class="sb"><div class="st">Ongoing obligation tracking <span class="tc">Evisort</span> <span class="tc">Slack</span></div><div class="ss">Push proactively — stakeholders should not need to ask for contract status. PPA CODs flagged at 180/90/60/30 days. Land lease renewals flagged 12 months out. Project finance covenants tracked quarterly. Build Slack alerts for automatic team notifications.</div></div></div>
</div>`;

sections.contracts=`
<h2>Contract types you will manage</h2>
<div class="cd"><div class="bd bd-r">High risk</div><h3>Power purchase agreement (PPA)</h3><p style="margin-bottom:.4rem">Long-term commitment to deliver power to a utility or corporate buyer. 15-20 year terms with performance milestones, capacity guarantees, and liquidated damages.</p><p><span style="font-weight:500">Track:</span> COD, capacity guarantees, availability requirements, augmentation triggers, renewal windows.</p><p style="margin-top:.3rem;color:#A32D2D;font-size:12px">Missed COD = automatic liquidated damages. Flag at 180/90/60/30 days.</p></div>
<div class="cd"><div class="bd bd-r">High risk</div><h3>Land lease / easement</h3><p style="margin-bottom:.4rem">Long-term lease of hundreds of acres from private landowners. 25-40 year terms with renewal options.</p><p><span style="font-weight:500">Track:</span> Renewal option windows, rent escalation schedules, amendment history, construction commencement, access rights.</p><p style="margin-top:.3rem;color:#A32D2D;font-size:12px">Missed renewal = loss of project site. Flag 12 months out.</p></div>
<div class="cd"><div class="bd bd-r">High risk</div><h3>Interconnection agreement (CAISO / ERCOT)</h3><p style="margin-bottom:.4rem">Governs how IPX physically connects solar/battery projects to the grid. Different from a PPA — between IPX and the grid operator, covering technical requirements and cost-sharing for grid upgrades.</p><p><span style="font-weight:500">Track:</span> Queue position milestones, study completion dates, cost allocation deadlines, execution windows.</p><p style="margin-top:.3rem;color:#A32D2D;font-size:12px">Missed milestone = lost queue position, often unrecoverable.</p></div>
<div class="cd"><div class="bd bd-a">Medium-high risk</div><h3>EPC contract (engineering, procurement, construction)</h3><p style="margin-bottom:.4rem">Contract with companies that physically build IPX's projects. Defines scope, schedule, price, and performance guarantees.</p><p><span style="font-weight:500">Track:</span> COD milestone, LD provisions, warranty periods, change order log, performance testing schedule.</p></div>
<div class="cd"><div class="bd bd-r">High risk</div><h3>Project finance agreement</h3><p style="margin-bottom:.4rem">Complex debt and tax equity financing — often hundreds of millions. Governed by loan/credit agreements with lenders and institutional investors.</p><p><span style="font-weight:500">Track:</span> Quarterly lender reporting, covenant compliance, draw conditions, insurance requirements, maturity dates.</p><p style="margin-top:.3rem;color:#A32D2D;font-size:12px">Covenant breach = technical default, can accelerate full loan repayment.</p></div>
<div class="cd"><div class="bd bd-g">Medium risk</div><h3>Outside counsel / vendor agreements</h3><p style="margin-bottom:.4rem">Engagement letters with law firms, vendor agreements with consultants and service providers.</p><p><span style="font-weight:500">Track:</span> Billing guideline compliance via Brightflag, budget vs actuals per matter, rate agreement renewals, invoice review cadence.</p></div>
<div class="ib"><p><span style="font-weight:500">PPA vs. interconnection — they are different contracts.</span> PPA = "I promise to sell you power" (IPX and buyer). Interconnection = "here is how my equipment connects to your grid" (IPX and CAISO/ERCOT). Both required. You cannot deliver power under a PPA without an interconnection agreement first.</p></div>`;

sections.ferc=`
<h2>FERC and regulatory knowledge</h2>
<div class="ab2"><p><span style="font-weight:500">Caveat:</span> This is general industry knowledge. Verify with Janelle how much of this legal ops owns vs. a separate regulatory affairs function.</p></div>
<div class="cd"><h3>Market-based rate authority (MBR)</h3><p style="margin-bottom:.4rem">FERC grants IPX permission to sell wholesale power at market-based rates rather than cost-based rates. Requires initial application, periodic triennial reviews, and ongoing status change reporting.</p><p style="margin-bottom:.4rem"><span style="font-weight:500">Why market-based matters:</span> Not just competitive advantage — it is about project finance. Market-based rates let IPX negotiate PPA pricing that makes projects bankable. Cost-based rates lock pricing to a formula that may not attract lenders or tax equity investors. The entire financing model depends on MBR authorization.</p><p><span style="font-weight:500">If MBR lapses:</span> Existing PPAs may be unenforceable at negotiated prices. New PPAs cannot be signed at market rates. The project finance model breaks.</p></div>
<div class="cd"><h3>Market-based vs. cost-based rates</h3><div class="cg" style="margin-bottom:0"><div style="background:#E6F1FB;border-radius:8px;padding:.75rem .875rem"><p style="font-weight:500;color:#0C447C;margin-bottom:.3rem">Market-based (what IPX wants)</p><p style="color:#185FA5;font-size:12px">Rates set by supply and demand. Higher upside, more fluctuation. Attractive to project finance lenders. Requires FERC MBR authorization.</p></div><div style="background:#F9FAFB;border-radius:8px;padding:.75rem .875rem;border:1px solid #E5E7EB"><p style="font-weight:500;color:#111827;margin-bottom:.3rem">Cost-based (traditional utility)</p><p style="color:#6B7280;font-size:12px">Rates = costs + regulated margin. Stable, predictable, but lower. May not generate cash flows attractive enough for lenders.</p></div></div></div>
<div class="cd"><h3>Other FERC touchpoints</h3><div class="rw"><div class="dt dt-b"></div><p><span style="font-weight:500">Electric Quarterly Reports (EQR)</span> — recurring filings detailing wholesale power transactions</p></div><div class="rw"><div class="dt dt-b"></div><p><span style="font-weight:500">FERC Form 556</span> — qualifying facility status under PURPA for some solar projects</p></div><div class="rw"><div class="dt dt-b"></div><p><span style="font-weight:500">Interconnection jurisdiction</span> — FERC has authority over interconnection agreements for CAISO projects on the interstate grid</p></div></div>
<div class="cd"><h3>How this hits your role</h3><p>You likely do not file anything yourself — outside counsel or regulatory specialists handle substance. But you may track filing deadlines in Evisort, coordinate with outside counsel on prep timelines, ensure the 90-day alert fires, and flag FERC-related covenants in project finance agreements.</p></div>
<div class="wb"><p><span style="font-weight:500">Unknown:</span> Whether legal ops, regulatory affairs, or outside counsel owns FERC tracking at IPX Power. Critical question for Janelle.</p></div>`;

<div class="ab2"><p><span style="font-weight:500">From your hypothetical guide — verify with Janelle.</span> Actual thresholds, required signatories, and exceptions by contract type or board pre-approval need confirmation.</p></div>
<div class="ag"><div class="ab"><div class="ad">$0 – $50K</div><div class="al">Director or Department Head</div><div class="ai" style="font-weight:500">1 signature</div></div><div class="ab"><div class="ad">$50K – $250K</div><div class="al">Director + Head of Legal Ops or GC</div><div class="ai" style="font-weight:500">2 signatures</div></div><div class="ab"><div class="ad">$250K – $1M</div><div class="al">GC + CFO or COO</div><div class="ai" style="font-weight:500">2 signatures</div></div><div class="ab"><div class="ad">Over $1M</div><div class="al">CLO + CFO + CEO</div><div class="ai" style="font-weight:500">3 signatures</div></div></div>
<div class="cd"><h3>Open questions about signing authority</h3><div class="rw"><div class="dt dt-a"></div><p>Are thresholds set by the Board, CLO, CFO, or a delegation of authority matrix?</p></div><div class="rw"><div class="dt dt-a"></div><p>Does contract type or risk level affect who signs, or is it purely dollar value?</p></div><div class="rw"><div class="dt dt-a"></div><p>Does the Board pre-approve certain contract classes regardless of dollar value?</p></div><div class="rw"><div class="dt dt-a"></div><p>Are some signatures legally required (bylaws or loan covenants) vs. operationally required (internal policy)?</p></div></div>
<div class="cd"><h3>DocuSign signing order — always</h3><p>1. Internal signatories in authority order — first</p><p>2. Counterparty — last</p><p style="margin-top:.4rem;font-size:12px">Confirm counterparty name, title, and email match the agreement before sending. Follow up after 48 hours. Escalate to Janelle after 5 days.</p></div>`;

sections.spend=`
<h2>Vendor and spend management</h2>
<div class="cd"><h3>Your role: financial gatekeeper, not budget owner</h3><p style="margin-bottom:.4rem">The CFO/Finance team owns the budget. The GC or CLO approves matter-level budgets with outside firms. You make sure what is being spent matches what was approved and is reported accurately.</p><p>Think financial compliance role — you catch a law firm billing 10 hours for document organization that violates guidelines, flag it, and make sure the right people know before it gets paid.</p></div>
<div class="cd"><h3>Confirmed invoice workflow</h3><div class="fl"><span class="fp">Law firm submits (LEDES)</span><span class="fa">&rarr;</span><span class="fp">Brightflag (guideline review)</span><span class="fa">&rarr;</span><span class="fp">Stampli (AP coding)</span><span class="fa">&rarr;</span><span class="fp">ERP / payment</span></div><p>Brightflag handles billing guideline enforcement with AI-driven flagging. Stampli handles AP processing, GL coding, and project allocation. ERP processes actual payment.</p></div>
<div class="cd"><h3>What billing guideline enforcement covers</h3><div class="rw"><div class="dt dt-r"></div><p>Prohibited practices — block billing, rounding up, first-year associate caps</p></div><div class="rw"><div class="dt dt-r"></div><p>Travel approval — thresholds before expenses are incurred</p></div><div class="rw"><div class="dt dt-r"></div><p>Rate schedules — when rate increases must be pre-approved</p></div><div class="rw"><div class="dt dt-r"></div><p>Staffing requirements — who can bill at what level on what matters</p></div><div class="rw"><div class="dt dt-r"></div><p>Admin charges — blocking billing for basic document organization, filing, etc.</p></div></div>
<div class="cd"><h3>Spend analytics to track</h3><div class="rw"><div class="dt dt-b"></div><p>Spend by firm, by matter, by practice area, by project</p></div><div class="rw"><div class="dt dt-b"></div><p>Budget vs. actual variance per matter</p></div><div class="rw"><div class="dt dt-b"></div><p>Outside counsel spend as a percentage of project cost</p></div><div class="rw"><div class="dt dt-b"></div><p>Invoice cycle time — receipt to payment approval</p></div></div>
<div class="pb"><p><span style="font-weight:500">Unknown:</span> Whether you do first-pass review or paralegals do. Whether you have direct reject authority or only escalation authority. Clarify during the Brightflag/Stampli session Thursday.</p></div>`;

sections.glossary=`
<h2>Industry glossary</h2>
<div class="cd">
<div class="gi"><div class="gt">COD — Commercial Operation Date</div><div class="gd">When a solar/battery project starts delivering power commercially. Missing this in a PPA triggers automatic liquidated damages. The single most important deadline you will track.</div></div><div class="dv"></div>
<div class="gi"><div class="gt">PPA — Power Purchase Agreement</div><div class="gd">Long-term contract (15-20 years) committing IPX to deliver power to a buyer. The core commercial contract for every project. Different from an interconnection agreement.</div></div><div class="dv"></div>
<div class="gi"><div class="gt">Interconnection agreement</div><div class="gd">Governs how IPX physically connects to the grid (CAISO or ERCOT). Between IPX and the grid operator — not the power buyer. Covers technical requirements and cost-sharing for grid upgrades. Required before a PPA can be delivered.</div></div><div class="dv"></div>
<div class="gi"><div class="gt">EPC — Engineering, Procurement & Construction</div><div class="gd">Contract type for companies that build IPX's projects. EPC contractors own construction timelines and performance guarantees.</div></div><div class="dv"></div>
<div class="gi"><div class="gt">CAISO — California Independent System Operator</div><div class="gd">Grid operator for most of California. IPX projects in CA interconnect through CAISO's queue. Missing queue milestones = lost position, often unrecoverable.</div></div><div class="dv"></div>
<div class="gi"><div class="gt">ERCOT — Electric Reliability Council of Texas</div><div class="gd">Texas grid operator. Same queue dynamics as CAISO.</div></div><div class="dv"></div>
<div class="gi"><div class="gt">FERC — Federal Energy Regulatory Commission</div><div class="gd">Federal regulator for wholesale electricity markets. IPX must maintain market-based rate authorization. FERC filings trigger at 90 days out.</div></div><div class="dv"></div>
<div class="gi"><div class="gt">MBR — Market-Based Rate authority</div><div class="gd">FERC permission to sell power at market rates. Requires initial application, triennial reviews, and ongoing reporting. Lapse = cannot sell power under PPAs.</div></div><div class="dv"></div>
<div class="gi"><div class="gt">Liquidated damages (LD)</div><div class="gd">Pre-agreed damages for specific contract failures (e.g. missing COD). Large, automatic, do not require proving actual harm.</div></div><div class="dv"></div>
<div class="gi"><div class="gt">Tax equity</div><div class="gd">Project finance structure where investors provide capital in exchange for ITC/PTC tax credits. Drives the financing model for solar projects.</div></div><div class="dv"></div>
<div class="gi"><div class="gt">ITC / PTC — Investment Tax Credit / Production Tax Credit</div><div class="gd">Federal tax credits under the IRA that make solar/battery projects financially viable. Drive project finance structure and tax equity investment.</div></div><div class="dv"></div>
<div class="gi"><div class="gt">Covenant</div><div class="gd">Binding obligation in project finance — e.g. maintaining financial ratios. Breach = technical default, can accelerate full loan repayment.</div></div><div class="dv"></div>
<div class="gi"><div class="gt">CLM — Contract Lifecycle Management</div><div class="gd">Software category Evisort belongs to. Covers intake through obligation tracking and renewal.</div></div><div class="dv"></div>
<div class="gi"><div class="gt">FEOC — Foreign Entity of Concern</div><div class="gd">IRA compliance requirement for supply chain documentation on projects claiming ITC/PTC. FEOC gaps trigger escalation at 60 days.</div></div><div class="dv"></div>
<div class="gi"><div class="gt">LEDES — Legal Electronic Data Exchange Standard</div><div class="gd">Standardized file format law firms use to submit invoices electronically. Every line item is coded with date, timekeeper, hours, rate, task code, activity code, and description. Enables Brightflag to automatically parse and review every line item against billing guidelines. Without LEDES, automated enforcement is not possible.</div></div><div class="dv"></div>
<div class="gi"><div class="gt">UTBMS — Uniform Task-Based Management System</div><div class="gd">Standardized billing codes used in LEDES invoices. Categorizes legal work by phase, task, and activity. Brightflag uses these codes for automated guideline enforcement — e.g. flagging an admin-coded line item that exceeds allowed amounts.</div></div><div class="dv"></div>
<div class="gi"><div class="gt">O&M — Operations & Maintenance</div><div class="gd">Long-term contract for ongoing project operation after construction. 10-15 business day review turnaround.</div></div>
</div>`;

sections.questions=`
<h2>Key questions to ask</h2>
<div class="cd"><h3>For Janelle — Week 1 priorities</h3>
<div class="qi"><div class="qq">"Walk me through what happens from the moment an outside counsel invoice hits Brightflag to the moment it gets paid — who touches it and in what order?"</div><div class="qw">Maps the entire invoice workflow and your specific role in it.</div></div>
<div class="qi"><div class="qq">"What is my actual authority when I flag a billing guideline violation? Do I reject it directly, or escalate to someone?"</div><div class="qw">Tells you how much financial ownership you actually have.</div></div>
<div class="qi"><div class="qq">"How do legal ops and paralegals divide contract lifecycle work — especially intake, DocuSign execution, and Evisort entry?"</div><div class="qw">Prevents stepping on toes or creating gaps where both people assume the other is handling something.</div></div>
<div class="qi"><div class="qq">"Do we have existing spend trackers or vendor rosters I should be maintaining, or is that something we are still building out?"</div><div class="qw">Tells you whether you are inheriting a system or building one — which is an opportunity to add value early.</div></div>
<div class="qi"><div class="qq">"Do we track FERC MBR authorization deadlines and filings, and if so who owns that — legal ops, regulatory affairs, or outside counsel?"</div><div class="qw">Clarifies the scope of your role in regulatory compliance.</div></div>
<div class="qi"><div class="qq">"Is Evisort where we track matter status, or do we have a separate matter management tool?"</div><div class="qw">Identifies a potential gap in the tech stack and where matter tracking actually lives.</div></div>
<div class="qi"><div class="qq">"What are the actual signing authority thresholds and who set them — Board, CLO, or delegation of authority matrix?"</div><div class="qw">Grounds you in the real policy vs. your hypothetical guide.</div></div>
</div>

sections.scenarios=`
<h2>Real-world scenarios</h2>
<p style="margin-bottom:1rem">Practice applying the process. Note: some details are from your hypothetical guide and may differ from actual IPX policy.</p>
<div class="sc"><div class="sq">A CAISO developer Slacks you: "Can you send me a quick NDA for a landowner meeting tomorrow?"</div><div class="sa">Do not handle it in Slack. Respond: "Got it — please submit through the Evisort intake form so I can track and route it properly. I will get it to attorney same day." NDA SLA is same-day intake, 3-5 business days to execution.</div></div>
<div class="sc"><div class="sq">An outside law firm invoice in Brightflag includes a $2,000 line for "document organization and filing."</div><div class="sa">Flag or reject the line item — billing guidelines typically prohibit basic administrative work. If Brightflag did not catch it automatically, note it to Janelle as a potential guideline configuration issue.</div></div>
<div class="sc"><div class="sq">A $350,000 vendor contract comes in. The requesting Director says "I have approved this, just send it to DocuSign."</div><div class="sa">Per the hypothetical matrix, $350K requires GC + CFO or COO. The Director alone lacks authority at this value. Route for correct approvals in Evisort first. Verify the threshold with Janelle — but never skip the signing authority check regardless of who tells you to.</div></div>
<div class="sc"><div class="sq">You upload an executed PPA to Evisort. What are the minimum steps before closing the matter?</div><div class="sa">Tag: contract type, counterparty, project, value. Enter all key dates: effective, expiration, COD, renewal windows, milestones. Set alerts at 180/90/60/30 days. Notify the business team. Flag COD to Operations at 180 days. Copy to Relativity if litigation-adjacent. An executed contract without dates entered is just a file.</div></div>
<div class="sc"><div class="sq">Finance asks how much IPX spent on outside counsel for the Darden project last quarter.</div><div class="sa">Pull the data from Brightflag — matter-level spend by project. If invoices were coded correctly in Stampli to the Darden project code, this should be a straightforward report. This is exactly why accurate invoice coding matters.</div></div>
<div class="sc"><div class="sq">A DocuSign envelope has been pending for 5 days without a signature.</div><div class="sa">You should have followed up after 48 hours. At 5 days, escalate to Janelle. No work should have started — a pending signature is not an executed contract.</div></div>
<div class="sc"><div class="sq">A law firm bills a first-year associate 40 hours on a complex PPA negotiation at $650/hour.</div><div class="sa">Check the billing guidelines and engagement letter rate card. If the rate exceeds the agreed rate for first-years, or if first-years should not be staffed on this matter type, flag in Brightflag. This is a rate compliance and staffing appropriateness issue.</div></div>
<div class="sc"><div class="sq">Evisort sends a 180-day alert on a land lease renewal window. What do you do?</div><div class="sa">Notify the attorney and Operations/Development immediately. Land leases should be flagged at 12 months out — if 180 days is your first alert, you may already be behind. Verify with Janelle whether land leases need a custom earlier trigger.</div></div>
<div class="sc"><div class="sq">A paralegal tells you they already uploaded the executed contract to Evisort and it is done.</div><div class="sa">Verify: are all obligation dates entered? Alerts set at 180/90/60/30? Tagged correctly? Business team notified? If not, it is not done. Clarify early with Janelle who owns the validation step.</div></div>
<div class="sc"><div class="sq">You notice a FERC MBR triennial review is approaching but no one has mentioned it.</div><div class="sa">First confirm whether this is your responsibility or belongs to regulatory affairs or outside counsel. If it is yours, check whether it is tracked in Evisort with alerts. If not tracked, flag to Janelle immediately. Do not assume someone else is handling it.</div></div>
</div>`;

}
show('overview');
